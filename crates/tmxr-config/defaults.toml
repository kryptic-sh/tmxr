# tmxr built-in defaults.
#
# This is mxaddict's tmux config (dotfiles/.config/tmux/tmux.conf) and the
# plugins it loads — catppuccin, vim-tmux-navigator, tmux-sensible, tmux-yank,
# tmux-resurrect — ported to tmxr. A user config (~/.config/tmxr/config.toml)
# is deep-merged over this file: set a key to change it, set a bind to `false`
# to remove it. Binds are tmux command strings. See docs/plan/06 and /07.

prefix = "C-b"
mouse = true
base-index = 0
pane-base-index = 0
renumber-windows = true
mode-keys = "vi"
# tmux-sensible values.
history-limit = 50000
prompt-history-limit = 100
escape-time = 0
display-time = 4000
display-panes-time = 1000
status-interval = 5
repeat-time = 500
default-terminal = "tmux-256color"
extended-keys = "always"
set-clipboard = "on"
# 24-bit colour on every terminal, as the tmux config's `terminal-overrides
# ",*:RGB"`; "auto" asks the client's environment, "off" sends the 256.
rgb-colour = "on"
# tmux.conf: set -g allow-passthrough on
allow-passthrough = true
remain-on-exit = false
# tmux's defaults: no activity or silence alerts.
monitor-activity = false
monitor-silence = 0
copy-command = ""
# tmux's default; `lock-client` runs it in the client's terminal.
lock-command = "lock -np"
# Who may open the server's socket or pipe, read when it starts: "owner", or
# "users" for every local user, of whom `server-access` admits those it names.
socket-access = "owner"
update-environment = [
  "DISPLAY",
  "SSH_ASKPASS",
  "SSH_AUTH_SOCK",
  "SSH_AGENT_PID",
  "SSH_CONNECTION",
  "WINDOWID",
  "XAUTHORITY",
  "WAYLAND_DISPLAY",
  "XDG_SESSION_TYPE",
  "XDG_CURRENT_DESKTOP",
  "XDG_RUNTIME_DIR",
]

[navigator]
# vim-tmux-navigator's @vim_navigator_pattern from the tmux config.
pattern = '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|sqeel|hjkl)(diff)?(-wrapped)?'
disable-when-zoomed = false

[status]
style = "bg=#{@thm_mantle},fg=#{@thm_fg}"
left = ""
right = "#{E:@status_session}#{E:@status_host}"
# tmux's defaults; the tmux config sets neither.
left-length = 10
right-length = 40
# catppuccin's "basic" window style, with the config's " #W" window text.
window-format = "#[fg=#{@thm_crust},bg=#{@thm_overlay2}] #I #[fg=#{@thm_fg},bg=#{@thm_surface0}] #W#{?window_flags, #{window_flags},} #[default]"
window-current-format = "#[fg=#{@thm_crust},bg=#{@thm_mauve}] #I #[fg=#{@thm_fg},bg=#{@thm_surface1}] #W#{?window_flags, #{window_flags},} #[default]"
pane-border-style = "fg=#{@thm_surface1}"
pane-active-border-style = "fg=#{@thm_blue}"
message-style = "fg=#{@thm_fg},bg=#{@thm_surface0}"
mode-style = "fg=#{@thm_fg},bg=#{@thm_selection}"
# tmux colours matches cyan and the current one magenta; here the palette's
# yellow and mauve.
copy-mode-match-style = "fg=#{@thm_crust},bg=#{@thm_yellow}"
copy-mode-current-match-style = "fg=#{@thm_crust},bg=#{@thm_mauve}"
# tmux draws the clock in blue.
clock-mode-colour = "#{@thm_blue}"
# tmux's blue and red, from the palette.
display-panes-colour = "#{@thm_blue}"
display-panes-active-colour = "#{@thm_red}"

[resurrect]
auto-save-minutes = 15
restore-on-start = true
keep = 20
# Programs restored by name; tmux-resurrect's `~text` (a command line holding
# text, restored whole) and `match->command` (restored as command) work too.
processes = ["vi", "vim", "nvim", "emacs", "man", "less", "more", "tail", "top", "htop", "irssi", "weechat", "mutt", "hjkl", "sqeel"]
# Of those, the ones restored with their arguments (`less app.log`, not
# `less`): tmux-resurrect's default list and hjkl. Arguments are saved in the
# plain-text save file, so leave out programs whose arguments can hold
# secrets (sqeel's connection strings).
restore-args = ["vi", "vim", "nvim", "emacs", "man", "less", "more", "tail", "top", "htop", "irssi", "weechat", "mutt", "hjkl"]

# User options (`@name`), readable in formats as #{@name}.
[options]
# Tokyo Night ("Night"), in catppuccin's role names so the status formats
# keep catppuccin's layout. docs/plan/07 has the mapping.
"@thm_mantle" = "#16161e"
"@thm_crust" = "#16161e"
"@thm_base" = "#1a1b26"
"@thm_surface0" = "#292e42"
"@thm_surface1" = "#3b4261"
"@thm_overlay2" = "#737aa2"
"@thm_fg" = "#c0caf5"
"@thm_mauve" = "#bb9af7"
"@thm_green" = "#9ece6a"
"@thm_red" = "#f7768e"
"@thm_blue" = "#7aa2f7"
"@thm_yellow" = "#e0af68"
"@thm_selection" = "#283457"
# catppuccin's session and host modules with the config's █ separators. The
# session block turns red while the prefix key is pending.
"@status_session_colour" = "#{?client_prefix,#{@thm_red},#{@thm_green}}"
"@status_session" = "#[fg=#{E:@status_session_colour},bg=#{@thm_mantle}]█#[fg=#{@thm_crust},bg=#{E:@status_session_colour}] #[fg=#{@thm_fg},bg=#{@thm_surface0}] #S#[fg=#{@thm_surface0},bg=#{@thm_mantle}]█"
"@status_host" = "#[fg=#{@thm_mauve},bg=#{@thm_mantle}]█#[fg=#{@thm_crust},bg=#{@thm_mauve}]󰒋 #[fg=#{@thm_fg},bg=#{@thm_surface0}] #H#[fg=#{@thm_surface0},bg=#{@thm_mantle}]█"

# ── Key binds ────────────────────────────────────────────────────────────────

[keys.root]
# vim-tmux-navigator: focus the neighbouring pane, or pass the key through to
# vim/hjkl/fzf when one is in front (navigator.pattern).
"C-h" = { cmd = "navigate-pane -L", note = "Focus pane left, or pass the key to vim/fzf-like apps" }
"C-j" = { cmd = "navigate-pane -D", note = "Focus pane down, or pass the key to vim/fzf-like apps" }
"C-k" = { cmd = "navigate-pane -U", note = "Focus pane up, or pass the key to vim/fzf-like apps" }
"C-l" = { cmd = "navigate-pane -R", note = "Focus pane right, or pass the key to vim/fzf-like apps" }
"C-\\" = { cmd = "navigate-pane -l", note = "Focus last pane, or pass the key to vim/fzf-like apps" }
# tmux.conf: Shift Alt vim keys to switch windows.
"M-h" = { cmd = "previous-window", note = "Previous window" }
"M-l" = { cmd = "next-window", note = "Next window" }
# The mouse (with `mouse on`), as tmux's own binds: a program that asked for
# the mouse gets it; otherwise click to focus, drag to select into copy mode,
# wheel up into copy mode, drag a border to resize, click a window in the
# status line. A pane event nothing binds goes to the program.
"MouseDown1Pane" = { cmd = "select-pane -t = ; send-keys -M", note = "Focus the pane clicked" }
"MouseDrag1Pane" = { cmd = "if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -M'", note = "Select text by dragging" }
"WheelUpPane" = { cmd = "if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -e ; send-keys -X -N 5 scroll-up'", note = "Scroll up into copy mode" }
"MouseDrag1Border" = { cmd = "resize-pane -M", note = "Resize panes by dragging a border" }
"MouseDown1Status" = { cmd = "select-window -t =", note = "Select the window clicked" }
"DoubleClick1Pane" = { cmd = "select-pane -t = ; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'copy-mode ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel'", note = "Copy the word double-clicked" }
"TripleClick1Pane" = { cmd = "select-pane -t = ; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'copy-mode ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel'", note = "Copy the line triple-clicked" }

[keys.prefix]
