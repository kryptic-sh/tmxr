"Up" = { cmd = "send-keys -X cursor-up", note = "Cursor up" }
"Down" = { cmd = "send-keys -X cursor-down", note = "Cursor down" }
"C-a" = { cmd = "send-keys -X start-of-line", note = "Start of line" }
"C-e" = { cmd = "send-keys -X end-of-line", note = "End of line" }
"Home" = { cmd = "send-keys -X start-of-line", note = "Start of line" }
"End" = { cmd = "send-keys -X end-of-line", note = "End of line" }
"M-m" = { cmd = "send-keys -X back-to-indentation", note = "First non-blank" }
"M-b" = { cmd = "send-keys -X previous-word", note = "Previous word" }
"M-f" = { cmd = "send-keys -X next-word-end", note = "End of word" }
"C-M-f" = { cmd = "send-keys -X next-matching-bracket", note = "Matching bracket" }
"C-M-b" = { cmd = "send-keys -X previous-matching-bracket", note = "Matching bracket back" }
"M-{" = { cmd = "send-keys -X previous-paragraph", note = "Previous paragraph" }
"M-}" = { cmd = "send-keys -X next-paragraph", note = "Next paragraph" }
"g" = { cmd = 'command-prompt -p "(goto line)" "send-keys -X goto-line \"%%\""', note = "Go to a line" }
"C-k" = { cmd = "send-keys -X copy-pipe-end-of-line-and-cancel", note = "Copy to the end of the line" }
"M-<" = { cmd = "send-keys -X history-top", note = "Top of history" }
"M->" = { cmd = "send-keys -X history-bottom", note = "Bottom of history" }
"M-R" = { cmd = "send-keys -X top-line", note = "Top of screen" }
"M-r" = { cmd = "send-keys -X middle-line", note = "Middle of screen" }
"C-v" = { cmd = "send-keys -X page-down", note = "Page down" }
"M-v" = { cmd = "send-keys -X page-up", note = "Page up" }
"Space" = { cmd = "send-keys -X page-down", note = "Page down" }
"NPage" = { cmd = "send-keys -X page-down", note = "Page down" }
"PPage" = { cmd = "send-keys -X page-up", note = "Page up" }
"M-Up" = { cmd = "send-keys -X halfpage-up", note = "Half page up" }
"M-Down" = { cmd = "send-keys -X halfpage-down", note = "Half page down" }
"C-Up" = { cmd = "send-keys -X scroll-up", note = "Scroll up" }
"C-Down" = { cmd = "send-keys -X scroll-down", note = "Scroll down" }
"C-s" = { cmd = 'command-prompt -i -T search -p "(search down)" "send-keys -X search-forward-incremental \"%%\""', note = "Search down as you type" }
"C-r" = { cmd = 'command-prompt -i -T search -p "(search up)" "send-keys -X search-backward-incremental \"%%\""', note = "Search up as you type" }
"n" = { cmd = "send-keys -X search-again", note = "Next match" }
"N" = { cmd = "send-keys -X search-reverse", note = "Previous match" }
"f" = { cmd = "send-keys -X jump-forward", note = "Jump to the next char typed" }
"F" = { cmd = "send-keys -X jump-backward", note = "Jump back to the char typed" }
"t" = { cmd = "send-keys -X jump-to-forward", note = "Jump to just before the next char typed" }
"T" = { cmd = "send-keys -X jump-to-backward", note = "Jump back to just after the char typed" }
";" = { cmd = "send-keys -X jump-again", note = "Repeat the last jump" }
"," = { cmd = "send-keys -X jump-reverse", note = "Repeat the last jump the other way" }
"X" = { cmd = "send-keys -X set-mark", note = "Set the mark" }
"M-x" = { cmd = "send-keys -X jump-to-mark", note = "Jump to the mark (and back)" }
"r" = { cmd = "send-keys -X refresh-from-pane", note = "Refresh from the live pane" }
"MouseDown1Pane" = { cmd = "select-pane ; send-keys -X clear-selection", note = "Move the cursor to the click" }
"MouseDrag1Pane" = { cmd = "select-pane ; send-keys -X begin-selection", note = "Select by dragging" }
"MouseDragEnd1Pane" = { cmd = "send-keys -X copy-selection-and-cancel", note = "Copy the dragged selection" }
"WheelUpPane" = { cmd = "select-pane ; send-keys -X -N 5 scroll-up", note = "Scroll up" }
"WheelDownPane" = { cmd = "select-pane ; send-keys -X -N 5 scroll-down", note = "Scroll down" }
"DoubleClick1Pane" = { cmd = "select-pane ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel", note = "Copy the word double-clicked" }
"TripleClick1Pane" = { cmd = "select-pane ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-selection-and-cancel", note = "Copy the line triple-clicked" }
