[package]
name = "tmxr-command"
description = "tmux-compatible command language for tmxr: parser, key names and formats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
crossterm = "0.29.0"
regex = "1.13.1"
thiserror = "2.0.21"
unicode-width = "0.2.2"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Time"] }

[dev-dependencies]
proptest = "1.12.0"
