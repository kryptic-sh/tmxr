[package]
name = "tmxr-server"
description = "The tmxr server: sessions, windows, panes, key tables, rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
crossterm = "0.29.0"
hjkl-clipboard = "0.42.1"
hjkl-layout = "0.42.1"
hjkl-picker = "0.42.1"
hjkl-picker-tui = "0.42.1"
hjkl-xdg = "0.42.1"
interprocess = "2.4.4"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tmxr-command.workspace = true
tmxr-config.workspace = true
tmxr-proto.workspace = true
tmxr-term.workspace = true
tracing = "0.1.44"
vt100 = "0.16.2"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3.27.0"
