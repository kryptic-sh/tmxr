[package]
name = "tmxr-term"
description = "One tmxr pane's terminal: PTY, terminal emulation (vt1k), input encoding, process inspection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
crossterm = "0.29.0"
portable-pty = "0.9.0"
tmxr-command.workspace = true
vt1k.workspace = true

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }
