[package]
name = "tmxr-term"
description = "One tmxr pane's terminal: PTY, vt100 emulation, input encoding, process inspection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[dependencies]
crossterm = "0.29.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading"] }
