# What a pane's program is told when it asks the terminal, as `cat -v` shows
# the answers on a raw terminal. Only what tmux 3.6 and 3.8 answer alike: 3.8
# answers DECRQM for more modes (known_divergences.toml).

[[cases]]
name = "decrqm_reports_the_modes_both_tmuxes_answer"
windows = "never"
pane = ["raw", { print = "\u001b[?2004h\u001b[?1006h\u001b[?2004$p\u001b[?1004$p\u001b[?1006$p\u001b[?12$p\u001b[?2031$p" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [
  { command = "capture-pane -p -t o", expect = "^[[?2004;1$y^[[?1004;2$y^[[?1006;1$y^[[?12;2$y^[[?2031;2$y" },
]

[[cases]]
name = "decrqss_reports_the_cursor_style"
windows = "bundled-conpty"
# The terminal's own shape (0) until the program sets one; no other setting.
pane = ["raw", { print = "\u001bP$q q\u001b\\\u001b[4 q\u001bP$q q\u001b\\\u001bP$qm\u001b\\" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [
  { command = "capture-pane -p -t o", expect = '^[P1$r q0 q^[\^[P1$r q4 q^[\^[P0$r^[\' },
]

[[cases]]
name = "decrqss_and_mode_12_fall_back_to_cursor_style"
windows = "bundled-conpty"
# A program that set no shape is told the pane's cursor-style.
pane = ["raw", { sleep = 1 }, { print = "\u001bP$q q\u001b\\\u001b[?12$p" }, "cat"]
steps = [{ run = "set -g cursor-style blinking-bar" }, { sleep = 1.5 }]
checks = [
  { command = "capture-pane -p -t o", expect = '^[P1$r q5 q^[\^[[?12;1$y' },
]

[[cases]]
name = "xtversion_and_da1_are_answered"
windows = "bundled-conpty"
# Their whole answers differ: XTVERSION names the program and its version,
# and tmux built with sixel adds 4 to DA1's (tmxr draws none).
attach = true
pane = ["raw", { print = "\u001b[>q\u001b[c" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [
  { screen_contains = "^[P>|", expect = true },
  { screen_contains = '^[\^[[?1;2', expect = true },
]

[[cases]]
name = "decrqm_reports_modes_tmux_3_6_does_not"
# tmux 3.8 answers DECRQM for these modes, and ANSI insert mode; 3.6 does
# not answer them, so this matches only against 3.8 (queries.toml has the
# modes both answer).
pane = ["raw", { print = "\u001b[?1h\u001b[4h\u001b[?1$p\u001b[?3$p\u001b[?7$p\u001b[?25$p\u001b[?1049$p\u001b[?1000$p\u001b[4$p" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [{ command = "capture-pane -p -t o" }]

[[cases]]
name = "decrqm_reports_synchronized_output_as_tmux_3_8"
windows = "bundled-conpty"
# tmux 3.8 holds a pane's synchronized output (mode 2026) and DECRQM says
# whether it is set; 3.6 neither holds it nor answers, so this matches only
# against 3.8.
pane = ["raw", { print = "\u001b[?2026$p\u001b[?2026h\u001b[?2026$p\u001b[?2026l\u001b[?2026$p" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [
  { command = "capture-pane -p -t o", expect = "^[[?2026;2$y^[[?2026;1$y^[[?2026;2$y" },
]

[[cases]]
name = "a_synchronized_redraw_is_held_until_its_end"
# tmux 3.8 draws nothing a program writes after `CSI ? 2026 h` until its
# `CSI ? 2026 l` or the hold's timeout, which each `h` puts off (here, for
# longer than the check takes to come); 3.6 draws it as it comes. The hold
# starts once the respawn's own redraw is done, as tmux 3.8 ends one on a
# pane it redraws whole.
attach = true
unix_only = true
steps = [
  { run = "respawn-pane -k -t o 'sleep 0.5; printf \"\\033[?2026hHELDONE\"; for i in 1 2 3 4 5 6; do sleep 0.5; printf \"\\033[?2026h\"; done; printf \"HELDTWO\\033[?2026l\"; exec sleep 1000'" },
  { sleep = 1 },
]
checks = [{ screen_contains = "HELDONE", expect = false }]
