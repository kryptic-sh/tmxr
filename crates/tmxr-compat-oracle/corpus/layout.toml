  { command = "list-panes -t o:0 -F '#{pane_index} #{pane_left},#{pane_top} #{pane_width}x#{pane_height}'" },
  { command = "list-panes -t o:1 -F '#{pane_index} #{pane_left},#{pane_top} #{pane_width}x#{pane_height}'" },
