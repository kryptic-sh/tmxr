# Splits, sizes and scrollbars. Expected values are tmux 3.6's, as its
# list-panes printed them for the same steps.

[[cases]]
name = "new_session_size_is_the_window_size"
checks = [{ format = "#{window_width}x#{window_height}", expect = "100x30" }]

[[cases]]
name = "split_h_gives_the_new_pane_the_smaller_half"
steps = [{ run = "split-window -h -t o" }]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "0+50\n51+49" }]

[[cases]]
name = "split_v_gives_the_new_pane_the_smaller_half"
steps = [{ run = "split-window -v -t o" }]
checks = [{ command = "list-panes -t o -F '#{pane_top}+#{pane_height}'", expect = "0+15\n16+14" }]

[[cases]]
name = "split_l_sizes_the_new_pane"
steps = [{ run = "split-window -h -l 30 -t o" }]
checks = [{ command = "list-panes -t o -F '#{pane_width}'", expect = "69\n30" }]

[[cases]]
name = "split_b_l_sizes_the_pane_before"
steps = [{ run = "split-window -h -b -l 30 -t o" }]
checks = [{ command = "list-panes -t o -F '#{pane_width}'", expect = "30\n69" }]

[[cases]]
name = "scrollbars_on_take_a_column"
steps = [{ run = "set -g pane-scrollbars on" }, { run = "split-window -h -t o" }]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "0+49\n51+48" }]

[[cases]]
name = "scrollbars_on_the_left"
steps = [
  { run = "set -g pane-scrollbars on" },
  { run = "set -g pane-scrollbars-position left" },
  { run = "split-window -h -t o" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "1+49\n52+48" }]

[[cases]]
name = "scrollbars_width_and_pad"
steps = [
  { run = "set -g pane-scrollbars on" },
  { run = "set -g pane-scrollbars-position left" },
  { run = "set -g pane-scrollbars-style bg=black,fg=white,width=2,pad=1" },
  { run = "split-window -h -t o" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "3+47\n54+46" }]

[[cases]]
name = "scrollbars_modal_only_in_copy_mode"
steps = [
  { run = "set -g pane-scrollbars modal" },
  { run = "set -g pane-scrollbars-position left" },
  { run = "set -g pane-scrollbars-style bg=black,fg=white,width=2,pad=1" },
  { run = "split-window -h -t o" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "0+50\n51+49" }]

[[cases]]
name = "scrollbars_modal_in_copy_mode"
steps = [
  { run = "set -g pane-scrollbars modal" },
  { run = "set -g pane-scrollbars-position left" },
  { run = "set -g pane-scrollbars-style bg=black,fg=white,width=2,pad=1" },
  { run = "split-window -h -t o" },
  { run = "copy-mode -t o:0.0" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "3+47\n51+49" }]

[[cases]]
name = "main_horizontal_sizes_the_main_pane"
steps = [
  { run = "split-window -t o" },
  { run = "split-window -t o" },
  { run = "select-layout -t o main-horizontal" },
]
checks = [{ command = "list-panes -t o -F '#{pane_top}+#{pane_height}'", expect = "0+24\n25+5\n25+5" }]

[[cases]]
name = "main_vertical_sizes_the_main_pane"
steps = [
  { run = "split-window -t o" },
  { run = "split-window -t o" },
  { run = "select-layout -t o main-vertical" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "0+80\n81+19\n81+19" }]

[[cases]]
name = "main_pane_height_as_a_percentage"
steps = [
  { run = "set -g main-pane-height 50%" },
  { run = "split-window -t o" },
  { run = "split-window -t o" },
  { run = "select-layout -t o main-horizontal" },
]
checks = [{ command = "list-panes -t o -F '#{pane_height}'", expect = "14\n15\n15" }]

[[cases]]
name = "other_pane_height_sizes_the_others"
steps = [
  { run = "set -g main-pane-height 3" },
  { run = "set -g other-pane-height 10" },
  { run = "split-window -t o" },
  { run = "split-window -t o" },
  { run = "select-layout -t o main-horizontal" },
]
checks = [{ command = "list-panes -t o -F '#{pane_height}'" }]

[[cases]]
name = "mirrored_layouts_keep_pane_numbers"
# The main pane is laid out last but stays pane 0; splits, rotations and
# swaps then follow tmux's pane list, not the layout's order.
steps = [
  { run = "split-window -t o" },
  { run = "split-window -t o" },
  { run = "select-layout -t o main-horizontal-mirrored" },
  { run = "split-window -b -t o:.1" },
  { run = "rotate-window -t o" },
  { run = "rotate-window -D -t o" },
  { run = "rotate-window -D -t o" },
  { run = "swap-pane -s o:.0 -t o:.2" },
]
checks = [
  { command = "list-panes -t o -F '#{pane_index}#{pane_id}@#{pane_top}+#{pane_height}'", expect = "0%3@6+24\n1%0@0+2\n2%2@3+2\n3%1@0+5" },
]

[[cases]]
name = "a_shrunk_pane_keeps_its_cursor_row"
unix_only = true
program = "seq 1 40; exec sleep 1000"
steps = [{ sleep = 0.5 }, { run = "split-window -v -t o" }, { sleep = 0.3 }]
checks = [
  { command = "display -p -t o.0 '#{history_size} #{cursor_y} #{pane_height}'", expect = "26 14 15" },
  { command = "capture-pane -p -t o.0" },
]

[[cases]]
name = "a_width_change_rewraps_lines_as_tmux"
# tmux's reflow: a wrapped line joins and splits at the new width, history
# included, and the cursor keeps its place in its line.
unix_only = true
size = [20, 4]
program = "printf 'abcdefghijklmnopqrstuvwxyz0123\\nx'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "resize-window -t o -x 10 -y 4" },
  { sleep = 0.3 },
  { run = "set -g @narrow '#{history_size} #{cursor_x},#{cursor_y}'" },
  { run = "resize-window -t o -x 40 -y 4" },
  { sleep = 0.3 },
]
checks = [
  { command = "capture-pane -p -S - -t o" },
  { format = "#{history_size} #{cursor_x},#{cursor_y}" },
]

[[cases]]
name = "a_narrowed_lines_history_and_cursor_as_tmux"
unix_only = true
size = [20, 4]
program = "printf 'abcdefghijklmnopqrstuvwxyz0123\\nab\\033[6G'; exec sleep 1000"
steps = [{ sleep = 0.5 }, { run = "resize-window -t o -x 10 -y 4" }, { sleep = 0.3 }]
checks = [
  { command = "capture-pane -p -S - -t o" },
  { format = "#{history_size} #{cursor_x},#{cursor_y}" },
]

[[cases]]
name = "a_wide_character_at_a_break_as_tmux"
unix_only = true
size = [20, 4]
program = "printf 'abc\\344\\270\\255def'; exec sleep 1000"
steps = [{ sleep = 0.5 }, { run = "resize-window -t o -x 4 -y 4" }, { sleep = 0.3 }]
checks = [
  { command = "capture-pane -p -S - -t o" },
  { format = "#{history_size} #{cursor_x},#{cursor_y}" },
]

[[cases]]
name = "a_resize_under_the_alternate_screen_reflows_as_it_goes"
unix_only = true
size = [20, 4]
program = "printf 'abcdefghijklmnopqrstuvwxy\\n\\033[?1049h'; sleep 1; printf '\\033[?1049l'; exec sleep 1000"
steps = [{ sleep = 0.4 }, { run = "resize-window -t o -x 10 -y 4" }, { sleep = 1.2 }]
checks = [
  { command = "capture-pane -p -S - -t o" },
  { format = "#{history_size} #{cursor_x},#{cursor_y}" },
]

[[cases]]
name = "capture_pane_prints_each_row_and_j_joins_wrapped_ones"
unix_only = true
size = [20, 6]
program = "printf 'abcdefghijklmnopqrstuvwxyz\nhi   \n'; exec sleep 1000"
steps = [{ sleep = 0.5 }]
checks = [
  { command = "capture-pane -p -t o", expect = "abcdefghijklmnopqrst\nuvwxyz\nhi" },
  { command = "capture-pane -pJ -t o", expect = "abcdefghijklmnopqrstuvwxyz\nhi" },
]

[[cases]]
name = "capture_pane_s_and_e_reach_into_the_history"
unix_only = true
size = [20, 6]
program = "seq 1 30; exec sleep 1000"
steps = [{ sleep = 0.5 }, { run = "capture-pane -b cap -S -2 -E 0 -t o" }]
checks = [
  { command = "display -p -t o '#{history_size}'", expect = "25" },
  { command = "capture-pane -p -S - -t o" },
  { command = "capture-pane -p -S -3 -E -1 -t o", expect = "23\n24\n25" },
  { command = "capture-pane -p -S 1 -E 2 -t o", expect = "27\n28" },
  { command = "capture-pane -p -S 2 -E 1 -t o", expect = "27\n28" },
  { command = "capture-pane -p -S '-#{history_size}' -E -24 -t o", expect = "1\n2" },
  { command = "capture-pane -p -S -1000 -E -999 -t o", expect = "1" },
  { command = "capture-pane -p -S x -t o", expect = "26\n27\n28\n29\n30" },
  { command = "show-buffer -b cap", expect = "24\n25\n26" },
]

[[cases]]
name = "capture_pane_a_reads_the_normal_screen_under_the_alternate_one"
unix_only = true
size = [20, 6]
program = "printf 'normal\\n0123456789012345678901\\nlast'; sleep 1; printf '\\033[?1049h\\033[Halt'; exec sleep 1000"
steps = [{ run = "new-window -d -t o:1" }, { sleep = 1.5 }]
checks = [
  { command = "capture-pane -p -t o:0", expect = "alt" },
  { command = "capture-pane -p -a -t o:0", expect = "normal\n01234567890123456789\n01\nlast" },
  { command = "capture-pane -p -aJ -t o:0", expect = "normal\n0123456789012345678901\nlast" },
  { command = "capture-pane -p -a -S -5 -E 0 -t o:0", expect = "normal" },
  { command = "capture-pane -p -a -S 2 -t o:0", expect = "01\nlast" },
  { command = "capture-pane -p -a -q -t o:1", expect = "" },
]

[[cases]]
name = "pane_targets_name_edges_corners_neighbours_and_offsets"
steps = [
  { run = "split-window -h -t o" },
  { run = "split-window -v -t o.1" },
  { run = "select-pane -t o.0" },
  { run = "new-window -d -t o:1" },
]
checks = [
  { command = "display -p -t 'o.{left}' '#P'", expect = "0" },
  { command = "display -p -t 'o.{right}' '#P'", expect = "1" },
  { command = "display -p -t 'o.{top}' '#P'", expect = "0" },
  { command = "display -p -t 'o.{bottom}' '#P'", expect = "0" },
  { command = "display -p -t 'o.{top-right}' '#P'", expect = "1" },
  { command = "display -p -t 'o.{bottom-right}' '#P'", expect = "2" },
  { command = "display -p -t 'o.bottom-left' '#P'", expect = "0" },
  { command = "display -p -t 'o.{right-of}' '#P'", expect = "2" },
  { command = "display -p -t 'o.+1' '#P'", expect = "1" },
  { command = "display -p -t 'o.+2' '#P'", expect = "2" },
  { command = "display -p -t 'o.-1' '#P'", expect = "2" },
  { command = "display -p -t 'o.{next}' '#P'", expect = "1" },
  { command = "display -p -t 'o.{previous}' '#P'", expect = "2" },
  { command = "display -p -t 'o:{next}' '#I'", expect = "1" },
]

[[cases]]
name = "break_pane_takes_s_for_the_pane_and_t_for_the_window"
steps = [
  { run = "new-session -d -s bp -n first -x 80 -y 24" },
  { run = "split-window -t bp:0" },
  { run = "split-window -t bp:0" },
  { run = "split-window -t bp:0" },
  { run = "break-pane -d -s bp:0.1 -t bp:5 -n five" },
  { run = "break-pane -d -s bp:0.1 -b -t bp:5 -n before" },
  { run = "new-window -d -t bp:7 -n lone" },
  { run = "break-pane -d -s bp:7.0 -t bp:9 -n moved" },
]
checks = [
  { command = "list-windows -t bp -F '#I #W #{window_panes}'", expect = "0 first 2\n5 before 1\n6 five 1\n9 moved 1" },
  { command = "show -wv -t bp:6 automatic-rename", expect = "off" },
]

[[cases]]
name = "z_keeps_a_window_zoomed_through_pane_commands"
steps = [
  # 0: last-pane -Z moves the zoom to the last pane.
  { run = "split-window -h -t o:0" },
  { run = "select-pane -t o:0.0" },
  { run = "resize-pane -Z -t o:0.0" },
  { run = "last-pane -Z -t o:0" },
  # 1: rotate-window unzooms; 2: with -Z it stays zoomed.
  { run = "new-window -d -t o:1" },
  { run = "split-window -h -t o:1" },
  { run = "resize-pane -Z -t o:1" },
  { run = "rotate-window -t o:1" },
  { run = "new-window -d -t o:2" },
  { run = "split-window -h -t o:2" },
  { run = "resize-pane -Z -t o:2" },
  { run = "rotate-window -Z -t o:2" },
  # 3: split-window -Z zooms the new pane, zoomed before or not.
  { run = "new-window -d -t o:3" },
  { run = "split-window -h -Z -t o:3" },
  # 4: swap-pane unzooms; 5: with -Z it stays zoomed.
  { run = "new-window -d -t o:4" },
  { run = "split-window -h -t o:4" },
  { run = "resize-pane -Z -t o:4" },
  { run = "swap-pane -s o:4.0 -t o:4.1" },
  { run = "new-window -d -t o:5" },
  { run = "split-window -h -t o:5" },
  { run = "resize-pane -Z -t o:5" },
  { run = "swap-pane -Z -s o:5.0 -t o:5.1" },
]
checks = [
  { command = "list-windows -t o -F '#I #{window_zoomed_flag} #{pane_index}'", expect = "0 1 1\n1 0 1\n2 1 1\n3 1 1\n4 0 0\n5 1 0" },
]

[[cases]]
name = "split_window_f_spans_the_window_and_p_is_a_percentage"
steps = [
