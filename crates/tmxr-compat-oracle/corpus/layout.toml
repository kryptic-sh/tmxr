  { command = "display -p '#{window_width}x#{window_height}'" },
]

[[cases]]
name = "fill_character_pads_a_smaller_window"
attach = true
unix_only = true
steps = [
  { run = "set -g fill-character +" },
  { run = "resize-window -t o -x 40 -y 10" },
  { sleep = 0.5 },
]
checks = [{ screen_find = "+" }, { screen_contains = "·", expect = false }]

[[cases]]
name = "pane_border_status_top"
attach = true
unix_only = true
steps = [
  { run = "split-window -h -t o" },
  { run = "select-pane -t o.0 -T leftone" },
  { run = "select-pane -t o.1 -T righttwo" },
  { run = "set -g pane-border-status top" },
  { sleep = 0.5 },
]
checks = [
  { command = "list-panes -t o -F '#{pane_index} #{pane_left},#{pane_top} #{pane_width}x#{pane_height}'" },
  { screen_find = "leftone" },
  { screen_find = "righttwo" },
  { command = "show -gv pane-border-status" },
]

[[cases]]
name = "pane_border_status_bottom_stacked"
attach = true
unix_only = true
steps = [
  { run = "split-window -v -t o" },
  { run = "select-pane -t o.0 -T upper" },
  { run = "select-pane -t o.1 -T lower" },
  { run = "set -g pane-border-status bottom" },
  { sleep = 0.5 },
]
checks = [
  { command = "list-panes -t o -F '#{pane_index} #{pane_left},#{pane_top} #{pane_width}x#{pane_height}'" },
  { screen_find = "upper" },
  { screen_find = "lower" },
]

[[cases]]
name = "split_window_with_an_empty_command_makes_an_empty_pane"
steps = [
  { run = "split-window -t o ''" },
  { run = "send-keys -t o.1 typed Enter" },
  { sleep = 0.3 },
]
checks = [
  { command = "list-panes -t o -F '#{pane_index} #{?#{==:#{pane_pid},0},none,pid} #{pane_dead} #{cursor_flag}'" },
  { command = "capture-pane -p -t o.1" },
]

[[cases]]
# With no last pane, last-pane in a window of two takes the other one.
name = "last_pane_without_one_takes_the_other_of_two"
steps = [{ run = "split-window -d -t o" }, { run = "last-pane -t o" }]
checks = [{ format = "#{pane_index}", expect = "1" }]

[[cases]]
# The window break-pane leaves takes its last pane as active and keeps
# none, so last-pane then falls back to the other of two.
name = "break_pane_leaves_the_last_pane_active"
steps = [
  { run = "split-window -t o" },
  { run = "split-window -t o" },
  { run = "select-pane -t o:0.0" },
  { run = "break-pane -d -s o:0.0" },
  { run = "set -gF @after '#{pane_id}'" },
  { run = "last-pane -t o:0" },
]
checks = [{ format = "#{@after} #{pane_id}", expect = "%2 %1" }]

[[cases]]
# respawn-pane keeps what is the pane's, not its program's: its own options
# (remain-on-exit keeps it when the new program ends) and its input off.
name = "respawn_pane_keeps_the_panes_own_options"
unix_only = true
steps = [
  { run = "new-window -d -t o:1 'sleep 100'" },
  { run = "set -p -t o:1 remain-on-exit on" },
  { run = "set -p -t o:1 @own x" },
  { run = "select-pane -d -t o:1" },
  { run = "respawn-pane -k -t o:1 true" },
  { sleep = 0.5 },
]
checks = [
  { command = "show -pv -t o:1 @own", expect = "x" },
  { format = "#{window_panes}", expect = "1" },
  { command = "display -p -t o:1 '#{pane_dead} #{pane_input_off}'", expect = "1 1" },
]
