# The mouse, as the owner's tmux config uses it (mouse on, tmux's default
# mouse binds): the same events in tmux and tmxr, and the same results. The
# cases named for the mouse off set it off first.

[[cases]]
name = "a_click_focuses_the_pane"
attach = true
unix_only = true
steps = [{ run = "split-window -h -t o" }, { sleep = 0.5 }, { mouse = { action = "click", at = [5, 5] } }]
checks = [{ format = "#{pane_index}", expect = "0" }]

[[cases]]
name = "a_drag_copies_the_selection"
attach = true
program = "printf 'alpha beta gamma\n'; exec sleep 1000"
steps = [
  { wait_text = "alpha beta gamma" },
  { mouse = { action = "drag", at = [0, 0], to = [4, 0] } },
  { sleep = 0.5 },
]
checks = [{ command = "show-buffer" }, { format = "#{pane_in_mode}" }]

[[cases]]
name = "a_double_click_copies_the_word"
attach = true
program = "printf 'alpha beta gamma\n'; exec sleep 1000"
steps = [
  { wait_text = "alpha beta gamma" },
  { mouse = { action = "double-click", at = [7, 0] } },
  { sleep = 1.0 },
]
checks = [{ command = "show-buffer" }, { format = "#{pane_in_mode}" }]

[[cases]]
name = "a_triple_click_copies_the_line"
attach = true
program = "printf 'alpha beta gamma\n'; exec sleep 1000"
steps = [
  { wait_text = "alpha beta gamma" },
  { mouse = { action = "triple-click", at = [7, 0] } },
  { sleep = 1.0 },
]
checks = [{ command = "show-buffer" }, { format = "#{pane_in_mode}" }]

[[cases]]
name = "the_wheel_scrolls_into_copy_mode"
attach = true
program = "seq 1 100; exec sleep 1000"
steps = [{ wait_text = "100" }, { mouse = { action = "wheel-up", at = [5, 5] } }]
checks = [{ format = "#{pane_in_mode}", expect = "1" }, { format = "#{scroll_position}" }]

[[cases]]
name = "the_wheel_scrolls_back_out"
attach = true
program = "seq 1 100; exec sleep 1000"
steps = [
  { wait_text = "100" },
  { mouse = { action = "wheel-up", at = [5, 5] } },
  { mouse = { action = "wheel-down", at = [5, 5] } },
  { mouse = { action = "wheel-down", at = [5, 5] } },
  { mouse = { action = "wheel-down", at = [5, 5] } },
]
checks = [{ format = "#{pane_in_mode}", expect = "0" }]

[[cases]]
name = "a_border_drag_resizes"
attach = true
unix_only = true
steps = [
  { run = "split-window -h -t o" },
  { sleep = 0.5 },
  { mouse = { action = "drag", at = [50, 5], to = [40, 5] } },
]
checks = [{ command = "list-panes -t o -F '#{pane_width}'" }]

[[cases]]
name = "a_click_on_a_window_name_selects_it"
attach = true
unix_only = true
steps = [
  { run = "rename-window -t o:0 first" },
  { run = "new-window -t o -n second" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = { text = "first", row = -1 } } },
]
checks = [{ format = "#{window_index}", expect = "0" }]

[[cases]]
name = "a_click_on_a_session_range_switches_to_it"
# status-format's session, pane and user ranges, as tmux's: the default
# MouseDown1Status (switch-client -t =) switches to a session range's
# session, and to a pane range's pane.
attach = true
unix_only = true
program = "exec sleep 1000"
steps = [
  { run = "set -g mouse on" },
  { run = "split-window -d -t o" },
  { run = "new-session -d -s other" },
  { run = "set -g status-format[0] '#[range=session|$1]SESSONE#[norange] #[range=pane|%1]PANEONE#[norange] #[range=user|btn]BUTTON'" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = { text = "PANEONE", row = -1 } } },
  { sleep = 0.3 },
  { mouse = { action = "click", at = { text = "SESSONE", row = -1 } } },
  { sleep = 0.5 },
]
checks = [
  { command = "display -p -t other '#{session_id}'", expect = "$1" },
  { command = "display -p -t o '#{pane_id}'", expect = "%1" },
  { command = "list-clients -F '#{client_session}'", expect = "other" },
]

[[cases]]
name = "a_pane_range_off_the_clicked_window_does_nothing"
# tmux's cmd_mouse_pane takes a pane range's pane only in the window the
# mouse is on: one in another session's window is no target.
attach = true
unix_only = true
program = "exec sleep 1000"
steps = [
  { run = "set -g mouse on" },
  { run = "new-session -d -s other" },
  { run = "split-window -t other" },
  { run = "set -g status-format[0] '#[range=pane|%1]OTHERPANE'" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = { text = "OTHERPANE", row = -1 } } },
  { sleep = 0.5 },
]
checks = [
  { command = "display -p -t other '#{pane_id}'", expect = "%2" },
  { command = "list-clients -F '#{client_session}'", expect = "o" },
]

[[cases]]
name = "mouse_status_range_names_the_range_clicked"
attach = true
unix_only = true
program = "exec sleep 1000"
steps = [
  { run = "set -g mouse on" },
  { run = "set -g status-format[0] '#[range=user|a-very-long-button-name]BUTTON#[norange] #[range=window|0]WINDOWZERO#[norange] NONE'" },
  { run = "bind -n MouseDown1Status set -gF @r '[#{mouse_status_range}]'" },
  { run = "bind -n MouseDown1StatusDefault set -gF @d '[#{mouse_status_range}]'" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = { text = "BUTTON", row = -1 } } },
  { sleep = 0.3 },
  { run = "set -gF @u '#{@r}'" },
  { mouse = { action = "click", at = { text = "WINDOWZERO", row = -1 } } },
  { sleep = 0.3 },
  { mouse = { action = "click", at = { text = "NONE", row = -1 } } },
  { sleep = 0.3 },
]
checks = [
  { format = "#{@u} #{@r} #{@d}", expect = "[a-very-long-but] [window] []" },
]

[[cases]]
name = "the_wheel_on_the_status_line_changes_window"
attach = true
unix_only = true
steps = [
  { run = "rename-window -t o:0 first" },
  { run = "new-window -d -t o -n second" },
  { sleep = 0.5 },
  { mouse = { action = "wheel-down", at = { text = "first", row = -1 } } },
]
checks = [{ format = "#{window_index}", expect = "1" }]

[[cases]]
name = "the_right_button_opens_the_pane_menu"
attach = true
unix_only = true
# Pressed, not let go: tmux runs the menu item a release lands on.
steps = [{ mouse = { action = "down", button = 3, at = [5, 5] } }]
checks = [{ screen_contains = "Horizontal Split", expect = true }]

[[cases]]
name = "a_release_over_a_menu_item_runs_it"
attach = true
unix_only = true
steps = [
  { mouse = { action = "down", button = 3, at = [5, 5] } },
  { wait_text = "Horizontal Split" },
  { mouse = { action = "drag", button = 3, at = { text = "Horizontal Split" }, to = { text = "Horizontal Split" } } },
  { sleep = 0.5 },
]
checks = [
  { format = "#{window_panes}", expect = "2" },
  { command = "list-panes -t o -F '#{pane_left}+#{pane_width}'" },
]

[[cases]]
name = "a_right_click_in_place_closes_the_menu"
# The release lands on the menu's border, outside its items.
attach = true
unix_only = true
steps = [{ mouse = { action = "click", button = 3, at = [5, 5] } }, { sleep = 0.5 }]
checks = [
  { screen_contains = "Horizontal Split", expect = false },
  { format = "#{window_panes}", expect = "1" },
]

[[cases]]
name = "the_right_button_in_copy_mode_opens_the_pane_menu"
# Copy mode's table has no MouseDown3Pane: the root table's runs, and its
# menu has copy mode's items.
attach = true
unix_only = true
program = "seq 1 100; exec sleep 1000"
steps = [
  { run = "copy-mode -t o" },
  { mouse = { action = "down", button = 3, at = [5, 5] } },
]
checks = [
  { screen_contains = "Go To Top", expect = true },
  { screen_contains = "Horizontal Split", expect = true },
]

[[cases]]
name = "a_right_tap_keeps_the_menu_it_opens"
# Read with the press, the release reaches the pane, not the menu the press
# opened: `h` then picks "Horizontal Split".
attach = true
unix_only = true
steps = [
  { mouse = { action = "tap", button = 3, at = [5, 5] } },
  { wait_text = "Horizontal Split" },
  { sleep = 0.5 },
  { keys = "h" },
  { sleep = 0.5 },
]
checks = [{ format = "#{window_panes}", expect = "2" }]

[[cases]]
name = "a_release_outside_a_menu_closes_it"
attach = true
unix_only = true
steps = [
  { mouse = { action = "down", button = 3, at = [5, 5] } },
  { wait_text = "Horizontal Split" },
  { mouse = { action = "up", button = 3, at = [90, 25] } },
  { sleep = 0.5 },
]
checks = [
  { screen_contains = "Horizontal Split", expect = false },
  { format = "#{window_panes}", expect = "1" },
]

[[cases]]
name = "the_middle_button_pastes"
attach = true
program = "exec cat"
steps = [
  { run = "set-buffer pastedtext" },
  { mouse = { action = "click", button = 2, at = [5, 5] } },
]
checks = [{ screen_contains = "pastedtext", expect = true }]

[[cases]]
name = "clicks_send_the_keys_tmux_sends"
attach = true
program = "printf 'alpha beta gamma\n'; exec sleep 1000"
steps = [
  { wait_text = "alpha beta gamma" },
  { run = "bind -n MouseDown1Pane set -ga @seen D" },
  { run = "bind -n MouseUp1Pane set -ga @seen U" },
  { run = "bind -n SecondClick1Pane set -ga @seen S" },
  { run = "bind -n DoubleClick1Pane set -ga @seen 2" },
  { run = "bind -n TripleClick1Pane set -ga @seen 3" },
  { mouse = { action = "double-click", at = [7, 0] } },
  { sleep = 1.0 },
]
# tmux 3.6 sends these for two quick clicks (checked with a pty client).
checks = [{ format = "#{@seen}", expect = "DUSU2" }]

[[cases]]
name = "a_slider_drag_ends_on_the_slider"
attach = true
program = "seq 1 200; exec sleep 1000"
steps = [
  { wait_text = "200" },
  { run = "set -g pane-scrollbars on" },
  { run = "bind -n MouseDragEnd1ScrollbarSlider set -g @seen slider" },
  { sleep = 0.5 },
  { mouse = { action = "drag", at = [99, 28], to = [99, 5] } },
  { sleep = 0.5 },
]
checks = [
  { format = "#{@seen}", expect = "slider" },
  { format = "#{pane_in_mode}", expect = "1" },
  { format = "#{scroll_position}" },
]

[[cases]]
name = "a_border_drag_ends_where_it_is_let_go"
attach = true
unix_only = true
steps = [
  { run = "split-window -h -t o" },
  { run = "bind -n MouseDragEnd1Border set -g @seen border" },
  { run = "bind -n MouseDragEnd1Pane set -g @seen pane" },
  { sleep = 0.5 },
  { mouse = { action = "drag", at = [50, 5], to = [40, 5] } },
  { sleep = 0.5 },
]
checks = [{ format = "#{@seen}" }]

[[cases]]
name = "a_status_format_line_is_drawn_and_its_window_ranges_clicked"
attach = true
unix_only = true
steps = [
  { run = "new-window -d -t o:1" },
  { run = "set -g status-format[0] '#[range=window|1]WONE#[norange] #[range=window|0]WZERO#[align=right]THEEND'" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = { text = "WONE", row = -1 } } },
  { sleep = 0.3 },
]
checks = [
  { screen_contains = "WONE WZERO", expect = true },
  { screen_contains = "THEEND", expect = true },
  { format = "#{window_index}", expect = "1" },
]

[[cases]]
name = "a_second_status_lines_ranges_take_no_clicks_as_tmux"
# tmux 3.6 reports a click on a later status line's window range as
# StatusDefault: only the first line's ranges are clicked on.
attach = true
unix_only = true
program = "exec sleep 1000"
steps = [
  { run = "set -g mouse on" },
  { run = "new-window -d -t o:1" },
  { run = "set -g status 2" },
  { run = "set -g status-format[1] 'X#[range=window|1]ONE'" },
  { run = "bind -n MouseDown1Status set -g @m Status" },
  { run = "bind -n MouseDown1StatusLeft set -g @m StatusLeft" },
  { run = "bind -n MouseDown1StatusRight set -g @m StatusRight" },
  { run = "bind -n MouseDown1StatusDefault set -g @m StatusDefault" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = { text = "ONE" } } },
  { sleep = 0.5 },
]
checks = [{ format = "#{@m}", expect = "StatusDefault" }]

[[cases]]
name = "a_key_after_a_click_counts_toward_a_paste_as_tmux"
attach = true
unix_only = true
program = "exec sleep 1000"
steps = [
  { run = "set -g mouse on" },
  { run = "set -g assume-paste-time 500" },
  { run = "bind -n x set -ga @hits x" },
  { sleep = 0.7 },
  { mouse = { action = "click", at = [5, 5] } },
  { keys = "x" },
  { keys = "x" },
  { sleep = 0.6 },
]
checks = [{ format = "[#{@hits}]" }]

# A program that asked for the mouse (as Claude Code does) is told where a
# drag is as it moves, and where it ended, not where it started.
[[cases]]
name = "a_drag_reaches_a_program_that_asked_for_the_mouse"
attach = true
pane = ["raw", { print = "\u001b[?1002h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "drag", at = [0, 5], to = [8, 5] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<0;1;6M^[[<32;3;6M^[[<32;5;6M^[[<32;7;6M^[[<32;9;6M^[[<0;9;6m", expect = true },
]

# One that asked for all motion (any-motion mode, as crossterm programs such
# as gpur do) is told of the mouse moving with no button held.
[[cases]]
name = "motion_reaches_a_program_that_asked_for_all_of_it"
attach = true
pane = ["raw", { print = "\u001b[?1003h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "move", at = [3, 5] } },
  { mouse = { action = "move", at = [6, 5] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<35;4;6M^[[<35;7;6M", expect = true },
]

# With `mouse off`, tmux binds nothing to the mouse and passes each event
# to the program under it, when that program asked for the mouse.
[[cases]]
name = "a_click_reaches_a_mouse_program_with_the_mouse_off"
attach = true
pane = ["raw", { print = "\u001b[?1002h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { run = "set -g mouse off" },
  { wait_text = "ready" },
  { mouse = { action = "click", at = [4, 2] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<0;5;3M^[[<0;5;3m", expect = true },
]

[[cases]]
name = "a_drag_reaches_a_mouse_program_with_the_mouse_off"
attach = true
pane = ["raw", { print = "\u001b[?1002h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { run = "set -g mouse off" },
  { wait_text = "ready" },
  { mouse = { action = "drag", at = [0, 5], to = [8, 5] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { format = "#{pane_in_mode}", expect = "0" },
]

# A program that did not ask gets nothing.
[[cases]]
name = "a_program_not_asking_gets_no_mouse_with_the_mouse_off"
attach = true
pane = ["raw", { print = "ready\r\n" }, "cat"]
steps = [
  { run = "set -g mouse off" },
  { wait_text = "ready" },
  { mouse = { action = "click", at = [4, 2] } },
  { mouse = { action = "wheel-up", at = [4, 2] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[", expect = false },
  { format = "#{pane_in_mode}", expect = "0" },
]

# The pane under the mouse gets it, not the active one, and is not focused.
[[cases]]
name = "the_pane_under_the_mouse_gets_it_with_the_mouse_off"
attach = true
pane = ["raw", { print = "\u001b[?1002h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { run = "set -g mouse off" },
  { wait_text = "ready" },
  { run = "split-window -h -t o \"stty raw -echo; printf 'right\\r\\n'; exec cat -v\"" },
  { wait_text = "right" },
  { mouse = { action = "click", at = [5, 5] } },
  { sleep = 0.5 },
]
checks = [
  { format = "#{pane_index}", expect = "1" },
  { command = "capture-pane -p -t o.0" },
  { command = "capture-pane -p -t o.1" },
  { screen_contains = "^[[<0;6;6M^[[<0;6;6m", expect = true },
]

# On the status line or a border, the mouse reaches no program.
[[cases]]
name = "the_status_line_and_borders_take_no_mouse_with_the_mouse_off"
attach = true
pane = ["raw", { print = "\u001b[?1002h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { run = "set -g mouse off" },
  { wait_text = "ready" },
  { run = "split-window -h -t o \"stty raw -echo; printf '\\033[?1002h\\033[?1006hright\\r\\n'; exec cat -v\"" },
  { wait_text = "right" },
  { mouse = { action = "click", at = [5, 29] } },
  { mouse = { action = "click", at = [50, 5] } },
  { sleep = 0.5 },
]
checks = [
  { format = "#{pane_index}", expect = "1" },
  { screen_contains = "^[", expect = false },
]

# A press on a pane showing the clock ends the clock, as any key does, and
# its program gets only the release.
[[cases]]
name = "a_click_ends_the_clock_with_the_mouse_off"
attach = true
pane = ["raw", { print = "\u001b[?1002h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { run = "set -g mouse off" },
  { wait_text = "ready" },
  { run = "split-window -h -t o \"stty raw -echo; printf '\\033[?1002h\\033[?1006hright\\r\\n'; exec cat -v\"" },
  { wait_text = "right" },
  { run = "clock-mode -t o.0" },
  { sleep = 0.5 },
  { mouse = { action = "click", at = [10, 5] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o.0" },
  { format = "#{pane_index}", expect = "1" },
]

# A double click on a program that asked for the mouse reaches it as two
# presses: the DoubleClick key the default bind sends on (send-keys -M) is
# one tmux passes nowhere.
[[cases]]
name = "a_double_click_reaches_a_mouse_program_as_two_presses"
attach = true
pane = ["raw", { print = "\u001b[?1000h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "double-click", at = [3, 5] } },
  { sleep = 0.8 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<0;4;6M^[[<0;4;6m^[[<0;4;6M^[[<0;4;6m", expect = true },
  { screen_contains = "^[[<0;4;6M^[[<0;4;6m^[[<0;4;6M^[[<0;4;6m^[[<0;4;6M", expect = false },
]

[[cases]]
name = "a_triple_click_reaches_a_mouse_program_as_tmuxs_does"
attach = true
pane = ["raw", { print = "\u001b[?1000h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "triple-click", at = [3, 5] } },
  { sleep = 0.8 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<0;4;6M^[[<0;4;6m^[[<0;4;6M^[[<0;4;6m^[[<0;4;6M^[[<0;4;6m", expect = true },
]

# The sideways wheel counts toward clicks as any button's press does, and
# a left click between breaks the run, as in tmux.
[[cases]]
name = "the_sideways_wheel_counts_clicks_as_tmuxs_buttons"
attach = true
pane = ["raw", { print = "\u001b[?1000h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { run = "bind -n MouseDown1Pane set -ga @seen D \\; send -M" },
  { run = "bind -n SecondClick1Pane set -ga @seen S \\; send -M" },
  { run = "bind -n MouseDown6Pane set -ga @seen 6 \\; send -M" },
  { run = "bind -n SecondClick6Pane set -ga @seen s \\; send -M" },
  { run = "bind -n DoubleClick6Pane set -ga @seen 2 \\; send -M" },
  { run = "bind -n TripleClick6Pane set -ga @seen 3 \\; send -M" },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { mouse = { action = "click", at = [3, 5] } },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { sleep = 0.8 },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { sleep = 0.8 },
]
checks = [
  { format = "#{@seen}", expect = "6D6s36s2" },
  { command = "capture-pane -p -t o" },
]

# The horizontal wheel is buttons 6 and 7 to tmux, which no default bind
# claims: a program that asked for the mouse gets them.
[[cases]]
name = "the_sideways_wheel_reaches_a_program_that_asked_for_the_mouse"
attach = true
pane = ["raw", { print = "\u001b[?1000h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { mouse = { action = "wheel-right", at = [6, 5] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<66;4;6M^[[<67;7;6M", expect = true },
]

# Twice in a cell is a double click, as for any button: the second press
# goes on, the DoubleClick key after it does not.
[[cases]]
name = "a_sideways_wheel_twice_reaches_the_program_twice"
attach = true
pane = ["raw", { print = "\u001b[?1000h\u001b[?1006hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { mouse = { action = "wheel-left", at = [3, 5] } },
  { sleep = 0.8 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[<66;4;6M^[[<66;4;6M", expect = true },
  { screen_contains = "^[[<66;4;6M^[[<66;4;6M^[[<66;4;6M", expect = false },
]

# Past column 222 the one-byte form has no byte for the position: tmux
# clamps it to 255 (cat -v's M-^?) rather than drop the click.
[[cases]]
name = "a_click_past_the_one_byte_range_is_clamped"
size = [240, 10]
attach = true
pane = ["raw", { print = "\u001b[?1000hready\r\n" }, "cat"]
steps = [
  { wait_text = "ready" },
  { mouse = { action = "click", at = [230, 2] } },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o" },
  { screen_contains = "^[[M M-^?#^[[M#M-^?#", expect = true },
]

# nvim selects by dragging when it has the mouse: the selection yanked and
# put back is the text dragged over, as in tmux.
[[cases]]
name = "nvim_selects_what_is_dragged_over"
attach = true
unix_only = true
program = '''exec nvim --clean -n -c 'set mouse=a' -c 'call setline(1, "alpha beta gamma")' '''
steps = [
  { wait_text = "alpha beta gamma" },
  { sleep = 0.5 },
  { mouse = { action = "drag", at = [0, 0], to = [8, 0] } },
  { sleep = 0.3 },
  { keys = "y$p" },
  { wait_text = "alpha bet" },
  { sleep = 0.3 },
]
checks = [
  { command = "capture-pane -p -t o -S 0 -E 1" },
  { screen_contains = "alpha beta gammaalpha bet", expect = true },
]
