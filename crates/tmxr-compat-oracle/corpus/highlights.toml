# Copy mode's highlights, cell by cell, as tmux's screen_check_selection
# and window_copy_update_style draw them.
[[cases]]
name = "down_drawn_under_vi_keys_as_tmux"
unix_only = true
attach = true
size = [30, 8]
program = "printf 'alpha beta gamma\\n  delta epsilon\\nzeta eta theta iota\\nkappa\\nlambda mu nu\\n'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g status off" },
  { run = "set -g mode-keys vi" },
  { run = "set -g copy-mode-mark-style 'bg=colour1'" },
  { run = "set -g copy-mode-current-match-style 'bg=colour2'" },
  { run = "set -g copy-mode-match-style 'bg=colour3'" },
  { run = "set -g copy-mode-selection-style 'bg=colour4'" },
  { run = "set -g copy-mode-position-format ''" },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X -N 6 cursor-right" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X -N 2 cursor-down" },
  { run = "send-keys -t o -X -N 3 cursor-right" },
  { sleep = 0.3 },
]
checks = [
  { screen_background = 1 },
  { screen_background = 2 },
  { screen_background = 3 },
  { screen_background = 4 },
]

