# Option scopes: global session and window options, a session's own, a window's
# own (-w) and a pane's own (-p). Expected values are tmux 3.6's. The errors (an unset user option, -o
# on a set one, an unknown name) are checked by tmxr's e2e tests: the oracle
# reads a failed command as an error.

[[cases]]
name = "a_window_option_without_g_is_the_windows_own"
steps = [{ run = "new-window -d -t o:1" }, { run = "set -t o:1 mode-keys emacs" }]
checks = [
  { command = "show -wv -t o:1 mode-keys", expect = "emacs" },
  { command = "show -gv mode-keys", expect = "vi" },
  { command = "show -v mode-keys", expect = "" },
  { command = "show -w -t o:0 mode-keys", expect = "" },
  { command = "show -wA -t o:0 mode-keys", expect = "mode-keys* vi" },
  { command = "show -w -t o:1", expect = "mode-keys emacs" },
  { command = "showw -t o:1", expect = "mode-keys emacs" },
]

[[cases]]
name = "a_pane_holds_its_own_pane_options"
steps = [{ run = "split-window -d -t o:0" }, { run = "set -p -t o:0.1 remain-on-exit on" }]
checks = [
  { command = "show -pv -t o:0.1 remain-on-exit", expect = "on" },
  { command = "show -pv -t o:0.0 remain-on-exit", expect = "" },
  { command = "show -p -t o:0.1", expect = "remain-on-exit on" },
  { command = "show -pA -t o:0.0 remain-on-exit", expect = "remain-on-exit* off" },
]

[[cases]]
name = "p_on_a_window_only_option_sets_the_window"
steps = [{ run = "split-window -d -t o:0" }, { run = "set -p -t o:0.1 pane-base-index 1" }]
checks = [
  { command = "show -wv -t o:0 pane-base-index", expect = "1" },
  { command = "show -p -t o:0.1", expect = "" },
]

[[cases]]
name = "set_w_u_takes_the_panes_values_too"
steps = [
  { run = "split-window -d -t o:0" },
  { run = "set -p -t o:0.1 remain-on-exit on" },
  { run = "set -wU -t o:0 remain-on-exit" },
]
checks = [{ command = "show -pv -t o:0.1 remain-on-exit", expect = "" }]

[[cases]]
name = "user_options_are_found_pane_window_then_global"
steps = [
  { run = "new-window -d -t o:1" },
  { run = "split-window -d -t o:1" },
  { run = "set @x global" },
  { run = "set -w -t o:1 @x window" },
  { run = "set -p -t o:1.1 @x pane" },
]
checks = [
  { command = "display -p -t o:1.0 '#{@x}'", expect = "window" },
  { command = "display -p -t o:1.1 '#{@x}'", expect = "pane" },
  { command = "display -p -t o:0.0 '#{@x}'", expect = "global" },
  { command = "show -w -t o:1", expect = "@x window" },
]

[[cases]]
name = "set_g_u_gives_back_the_default"
steps = [{ run = "set -g main-pane-width 10" }, { run = "set -gu main-pane-width" }]
checks = [{ command = "show -gv main-pane-width", expect = "80" }]

[[cases]]
name = "a_windows_options_apply_to_it_alone"
steps = [
  { run = "new-window -d -t o:1" },
  { run = "split-window -d -t o:1" },
  { run = "set -w -t o:1 pane-base-index 1" },
]
checks = [
  { command = "list-panes -t o:1 -F '#{pane_index}'", expect = "1\n2" },
  { command = "list-panes -t o:0 -F '#{pane_index}'", expect = "0" },
]

[[cases]]
# On session p: tmux gives o, made with -x / -y, its own default-size.
name = "a_session_option_without_g_is_the_sessions_own"
steps = [{ run = "new-session -d -s p" }, { run = "set -t p status-left AAA" }]
checks = [
  { command = "show -v -t p status-left", expect = "AAA" },
  { command = "show -v -t o status-left", expect = "" },
  { command = "show -t p", expect = "status-left AAA" },
  { command = "show -A -t o mouse", expect = "mouse* on" },
]

[[cases]]
name = "set_u_gives_a_session_the_global_value_back"
steps = [
  { run = "new-session -d -s p" },
  { run = "set -t p status-left AAA" },
  { run = "set -t p -u status-left" },
]
checks = [{ command = "show -t p", expect = "" }]

[[cases]]
name = "user_options_without_w_are_the_sessions"
steps = [{ run = "new-session -d -s p" }, { run = "set -t o @u sess" }]
checks = [
  { command = "display -p -t o '#{@u}'", expect = "sess" },
  { command = "display -p -t p '#{@u}'", expect = "" },
  { command = "show -t o @u", expect = "@u sess" },
  { command = "show -q -t p @u", expect = "" },
]

[[cases]]
name = "a_sessions_base_index_numbers_its_new_windows"
steps = [
  { run = "new-session -d -s p" },
  { run = "set -t p base-index 3" },
  { run = "new-window -d -t p" },
  { run = "new-window -d -t o" },
]
checks = [
  { command = "list-windows -t p -F '#I'", expect = "0\n3" },
  { command = "list-windows -t o -F '#I'", expect = "0\n1" },
]

[[cases]]
name = "show_options_quotes_strings_as_tmux"
steps = [
  { run = "set -g @a 'a b'" },
  { run = "set -g @b \"it's\"" },
  { run = "set -g @c 'x\"y'" },
  { run = "set -g @d '~/x'" },
  { run = "set -g @e ''" },
  { run = "set -t o status-left '[#S] '" },
  { run = "set -wg clock-mode-colour '#ff0000'" },
  { run = "set -g prefix C-a" },
  { run = "set -w -t o:0 window-status-format '#I #W'" },
]
checks = [
  { command = "show -g @a", expect = '@a "a b"' },
  { command = "show -g @b", expect = "@b \"it's\"" },
  { command = "show -g @c", expect = "@c 'x\"y'" },
  { command = "show -g @d", expect = '@d \~/x' },
  { command = "show -g @e", expect = "@e ''" },
  { command = "show -t o status-left", expect = 'status-left "[#S] "' },
  { command = "show -wg clock-mode-colour", expect = "clock-mode-colour #ff0000" },
  { command = "show -g prefix", expect = "prefix C-a" },
  { command = "show -w -t o:0 window-status-format", expect = 'window-status-format "#I #W"' },
]

[[cases]]
name = "show_options_h_lists_the_hooks_set_there"
steps = [
  { run = "new-session -d -s p" },
  { run = "set-hook -t p client-attached 'display-message r'" },
  { run = "set-hook -a -t p client-attached 'display-message s'" },
  { run = "set-hook -p -t p:0.0 pane-exited 'display-message x'" },
]
checks = [
  { command = "show -H -t p", expect = "client-attached[0] display-message r\nclient-attached[1] display-message s" },
  { command = "show -vH -t p", expect = "display-message r\ndisplay-message s" },
  { command = "show -t p", expect = "" },
  { command = "show -pH -t p:0.0", expect = "pane-exited[0] display-message x" },
]

[[cases]]
name = "global_window_user_options_are_apart_and_found_first"
steps = [
  { run = "set -g @ux sess" },
  { run = "set -wg @ux win" },
  { run = "set -t o @ux own" },
]
checks = [
  { command = "show -g @ux", expect = "@ux sess" },
  { command = "show -wg @ux", expect = "@ux win" },
  { command = "show -t o @ux", expect = "@ux own" },
  { command = "show -wA -t o:0 @ux", expect = "@ux* win" },
  { command = "display -p -t o '#{@ux}'", expect = "win" },
]

[[cases]]
name = "unsetting_a_global_window_user_option_shows_the_session_one"
steps = [
  { run = "set -g @uy sess" },
  { run = "set -wg @uy win" },
  { run = "set -wgu @uy" },
]
checks = [
  { command = "display -p -t o '#{@uy}'", expect = "sess" },
  { command = "show -wgq @uy", expect = "" },
  { command = "show -g @uy", expect = "@uy sess" },
]

[[cases]]
name = "array_options_are_set_and_shown_by_index"
steps = [
  { run = "new-session -d -s q" },
  { run = "set -g update-environment 'A B,C'" },
  { run = "set -ga update-environment D" },
  { run = "set -g update-environment[5] 'F G'" },
  { run = "set -ga update-environment H" },
  { run = "set -ag update-environment[5] '!'" },
  { run = "set -gu update-environment[1]" },
  { run = "set -t q update-environment[2] X" },
  { run = "set -t q -a update-environment Y" },
  { run = "set -g status-left-length 7" },
]
checks = [
  { command = "show -g update-environment", expect = "update-environment[0] A\nupdate-environment[2] C\nupdate-environment[3] D\nupdate-environment[4] H\nupdate-environment[5] \"F G!\"" },
  { command = "show -gv update-environment", expect = "A\nC\nD\nH\nF G!" },
  { command = "show -g update-environment[4]", expect = "update-environment[4] H" },
  { command = "show -t q update-environment", expect = "update-environment[0] Y\nupdate-environment[2] X" },
  { command = "show -A -t q update-environment[1]", expect = "update-environment[1] ''" },
  { command = "show -g status-left-length[1]", expect = "status-left-length[1] 7" },
]

[[cases]]
name = "an_empty_array_option_shows_its_bare_name"
steps = [{ run = "new-session -d -s q" }, { run = "set -g update-environment ''" }]
checks = [
  { command = "show -g update-environment", expect = "update-environment" },
  { command = "show -gv update-environment", expect = "" },
  { command = "show -A -t q update-environment", expect = "update-environment" },
]

