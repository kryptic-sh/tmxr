# What a pane's program that asked for xterm's modifyOtherKeys gets for keys
# from the client's terminal, as `cat -v` shows it on a raw terminal. The
# terminal sends C-; C-Enter S-Enter as `CSI <key>;<modifiers>u`, which both
# clients read, then C-a, M-a and BTab in their legacy bytes; one key at a
# time, as tmux 3.6's client can split a key read in one piece with others.
# tmux.conf sets `extended-keys always`.

[[cases]]
name = "level_1_extends_the_keys_with_no_legacy_form_in_xterms_form"
windows = "never"
attach = true
pane = ["raw", { print = "\u001b[>4;1m" }, "cat"]
steps = [
  { sleep = 0.5 },
  { keys = "\u001b[59;5u" },
  { sleep = 0.2 },
  { keys = "\u001b[13;5u" },
  { sleep = 0.2 },
  { keys = "\u001b[13;2u" },
  { sleep = 0.2 },
  { keys = "\u0001" },
  { sleep = 0.2 },
  { keys = "\u001ba" },
  { sleep = 0.2 },
  { keys = "\u001b[Z" },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o", expect = "^[[27;5;59~^[[27;5;13~^[[27;2;13~^A^[a^[[Z" },
  { command = "show -s extended-keys-format", expect = "extended-keys-format xterm" },
]

[[cases]]
name = "level_2_extends_every_modified_key"
windows = "never"
attach = true
pane = ["raw", { print = "\u001b[>4;2m" }, "cat"]
steps = [
  { sleep = 0.5 },
  { keys = "\u001b[59;5u" },
  { sleep = 0.2 },
  { keys = "\u001b[13;5u" },
  { sleep = 0.2 },
  { keys = "\u001b[13;2u" },
  { sleep = 0.2 },
  { keys = "\u0001" },
  { sleep = 0.2 },
  { keys = "\u001ba" },
  { sleep = 0.2 },
  { keys = "\u001b[Z" },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o", expect = "^[[27;5;59~^[[27;5;13~^[[27;2;13~^[[27;5;97~^[[27;3;97~^[[27;2;9~" },
]

[[cases]]
name = "extended_keys_format_csi_u_at_either_level"
windows = "never"
attach = true
pane = ["raw", { print = "\u001b[>4;1m" }, "cat"]
steps = [
  { sleep = 0.5 },
  { run = "set -s extended-keys-format csi-u" },
  { keys = "\u001b[59;5u" },
  { sleep = 0.2 },
  { keys = "\u0001" },
  { sleep = 0.2 },
  { run = "split-window -t o 'stty raw -echo; printf \"\\033[>4;2m\"; exec cat -v'" },
  { sleep = 0.5 },
  { keys = "\u001b[59;5u" },
  { sleep = 0.2 },
  { keys = "\u001ba" },
  { sleep = 0.2 },
  { keys = "\u001b[Z" },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o.0", expect = "^[[59;5u^A" },
  { command = "capture-pane -p -t o.1", expect = "^[[59;5u^[[97;3u^[[9;2u" },
]

[[cases]]
# `CSI > 4 n` turns the keys off, and a level past 2 is none; with
# `extended-keys always` both panes are at level 1.
name = "modify_other_keys_off_and_a_level_past_2"
windows = "never"
attach = true
pane = ["raw", { print = "\u001b[>4;2m\u001b[>4n" }, "cat"]
steps = [
  { sleep = 0.5 },
  { keys = "\u0001" },
  { sleep = 0.2 },
  { keys = "\u001b[59;5u" },
  { sleep = 0.2 },
  { run = "split-window -t o 'stty raw -echo; printf \"\\033[>4;3m\"; exec cat -v'" },
  { sleep = 0.5 },
  { keys = "\u0001" },
  { sleep = 0.2 },
  { keys = "\u001b[59;5u" },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o.0", expect = "^A^[[27;5;59~" },
  { command = "capture-pane -p -t o.1", expect = "^A^[[27;5;59~" },
  { format = "#{pane_key_mode}", expect = "Ext 1" },
]

# The client's terminal and modifyOtherKeys (plan 18 step 5). tmux asks a
# terminal for it (`CSI > 4 ; 2 m`, its `Eneks`) once the terminal's
# XTVERSION answer names one it gives `extkeys` (XTerm, foot, mintty, iTerm2)
# and `extended-keys` is not off; tmxr does the same for a terminal without
# the kitty protocol, as the oracle's is.

[[cases]]
name = "an_xterm_terminal_is_asked_for_modify_other_keys"
windows = "never"
attach = true
terminal = "XTerm(390)"
steps = [{ sleep = 0.5 }]
checks = [{ terminal_received = "\u001b[>4;2m", expect = true }]

[[cases]]
name = "a_terminal_named_as_neither_is_not_asked_for_modify_other_keys"
windows = "never"
attach = true
terminal = "WezTerm 20240203"
steps = [{ sleep = 0.5 }]
checks = [{ terminal_received = "\u001b[>4;2m", expect = false }]

[[cases]]
# Keys such a terminal sends under modifyOtherKeys reach a pane that asked
# for level 2 in xterm's form: Ctrl+i (apart from Tab), Ctrl+;, and Alt+a
# with no bare Escape. (Not a legacy Ctrl+h, which tmxr's default root
# table binds, nor Tab, which tmxr's capture-pane expands.)
name = "an_xterm_terminals_keys_reach_a_pane"
windows = "never"
attach = true
terminal = "XTerm(390)"
pane = ["raw", { print = "\u001b[>4;2m" }, "cat"]
steps = [
  { sleep = 0.5 },
  { keys = "\u001b[27;5;105~" },
  { sleep = 0.2 },
  { keys = "\u001b[27;5;59~" },
  { sleep = 0.2 },
  { keys = "\u001b[27;3;97~" },
  { sleep = 0.5 },
]
checks = [
  { terminal_received = "\u001b[>4;2m", expect = true },
  { command = "capture-pane -p -t o", expect = "^[[27;5;105~^[[27;5;59~^[[27;3;97~" },
]

[[cases]]
name = "send_keys_sends_the_keys_tmux_keeps_apart_at_level_2"
# send-keys names each key as tmux 3.6 does: C-A is the upper-case letter
# with Ctrl alone (65), C-S-a the letter with Ctrl and Shift (97), C-4 the
# digit (52) apart from C-\ (92), and C-@ apart from C-Space.
windows = "never"
pane = ["raw", { print = "\u001b[>4;2m" }, "cat"]
steps = [
  { sleep = 0.5 },
  { run = "send-keys -t o C-a C-A C-S-a C-4 'C-\\' C-@ C-Space C-h C-S-h" },
  { sleep = 0.5 },
]
checks = [{ command = "capture-pane -p -t o" }]

[[cases]]
name = "send_keys_tab_and_keypad_names_at_level_2"
# At level 2 tmux sends S-Tab and BTab alike as Shift with Tab, C-S-Tab with
# Ctrl and Shift, and the keypad's unmodified keys as their characters,
# KPEnter a newline.
windows = "never"
pane = ["raw", { print = "\u001b[>4;2m" }, "cat"]
steps = [
  { sleep = 0.5 },
  { run = "send-keys -t o S-Tab BTab C-S-Tab C-Tab KP1 KP/ KPEnter C-S-1" },
  { sleep = 0.5 },
]
checks = [{ command = "capture-pane -p -t o" }]

