# Known differences from tmux: run and reported by known_divergences_report,
# never failing. Move a case to its corpus file once it matches.

[[cases]]
name = "an_escape_and_a_click_in_one_read_are_typed"
# tmux reads ESC ESC [<2;6;6M as Alt+Escape and then typed text, and so
# passes it all to the program; no click. tmxr's client parses its input
# with crossterm, which drops what is left of a read once it has an event, so
# it reads ESC ESC then the click; a lone Alt+Escape matches (keys.toml).
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [{ sleep = 0.5 }, { keys = "\u001b\u001b[<2;6;6M" }, { sleep = 0.5 }]
checks = [
  { screen_contains = "^[^[[<2;6;6M", expect = true },
  { format = "#{window_panes}", expect = "1" },
]

[[cases]]
name = "capture_pane_t_counts_an_erased_cell_as_written"
# tmux's cellused counts a cell erased inside what was written (here the c
# of abc, erased by EL), so -N -T and -J keep it as a space (a line follows,
# as the oracle trims a capture's end); vt100 keeps an
# erased cell as one never written, so tmxr's Line::used stops at the b.
program = 'sleep 0.5; printf "abc\033[1D\033[K\nend\n"; exec sleep 1000'
steps = [{ sleep = 1.5 }]
checks = [
  { command = "capture-pane -p -N -T -E 1" },
  { command = "capture-pane -p -J -E 1" },
]

[[cases]]
name = "show_hooks_g_lists_the_hooks_tmxr_fires"
# tmux lists every hook in its session table; tmxr leaves out the one it
# does not fire (after-queue), as set-hook refuses it. The rest are in tmux's
# order.
steps = [{ run = "set-hook -g after-new-window 'display hi'" }]
checks = [{ command = "show-hooks -g" }]

[[cases]]
name = "sixel_support_is_0_in_tmxr"
# tmux built with sixel says 1; tmxr draws no sixel images.
steps = []
checks = [{ format = "#{sixel_support}" }]

[[cases]]
name = "decrqm_reports_modes_tmux_3_6_does_not"
# tmux 3.8 answers DECRQM for these modes, and ANSI insert mode; 3.6 does
# not answer them, so this matches only against 3.8 (queries.toml has the
# modes both answer).
pane = ["raw", { print = "\u001b[?1h\u001b[4h\u001b[?1$p\u001b[?3$p\u001b[?7$p\u001b[?25$p\u001b[?1049$p\u001b[?1000$p\u001b[4$p" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [{ command = "capture-pane -p -t o" }]

[[cases]]
name = "decrqm_reports_synchronized_output_as_tmux_3_8"
# tmux 3.8 holds a pane's synchronized output (mode 2026) and DECRQM says
# whether it is set; 3.6 neither holds it nor answers, so this matches only
# against 3.8.
pane = ["raw", { print = "\u001b[?2026$p\u001b[?2026h\u001b[?2026$p\u001b[?2026l\u001b[?2026$p" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [
  { command = "capture-pane -p -t o", expect = "^[[?2026;2$y^[[?2026;1$y^[[?2026;2$y" },
]

[[cases]]
name = "a_synchronized_redraw_is_held_until_its_end"
# tmux 3.8 draws nothing a program writes after `CSI ? 2026 h` until its
# `CSI ? 2026 l` or the hold's timeout, which each `h` puts off (here, for
# longer than the check takes to come); 3.6 draws it as it comes. The hold
# starts once the respawn's own redraw is done, as tmux 3.8 ends one on a
# pane it redraws whole.
attach = true
unix_only = true
steps = [
  { run = "respawn-pane -k -t o 'sleep 0.5; printf \"\\033[?2026hHELDONE\"; for i in 1 2 3 4 5 6; do sleep 0.5; printf \"\\033[?2026h\"; done; printf \"HELDTWO\\033[?2026l\"; exec sleep 1000'" },
  { sleep = 1 },
]
checks = [{ screen_contains = "HELDONE", expect = false }]

[[cases]]
name = "xtversion_names_tmxr"
# tmux answers DCS >|tmux and its version; tmxr names itself and its own
# version, as its #{version} does.
pane = ["raw", { print = "\u001b[>q" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [{ command = "capture-pane -p -t o" }]
