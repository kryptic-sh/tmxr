# Known differences from tmux: run and reported by known_divergences_report,
# never failing. Move a case to its corpus file once it matches.

[[cases]]
name = "an_escape_and_a_click_in_one_read_are_typed"
# tmux reads ESC ESC [<2;6;6M as Alt+Escape and then typed text, and so
# passes it all to the program; no click. tmxr's client decodes its input
# with ttyr, which reads the escapes and then the click as a click (seen
# 2026-11-11, which opens the pane menu); a lone Alt+Escape matches
# (keys.toml).
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [{ sleep = 0.5 }, { keys = "\u001b\u001b[<2;6;6M" }, { sleep = 0.5 }]
checks = [
  { screen_contains = "^[^[[<2;6;6M", expect = true },
  { format = "#{window_panes}", expect = "1" },
]

[[cases]]
name = "capture_pane_t_counts_an_erased_cell_as_written"
# tmux's cellused counts a cell erased inside what was written (here the c
# of abc, erased by EL), so -N -T and -J keep it as a space (a line follows,
# as the oracle trims a capture's end); vt100 keeps an
# erased cell as one never written, so tmxr's Line::used stops at the b.
program = 'sleep 0.5; printf "abc\033[1D\033[K\nend\n"; exec sleep 1000'
steps = [{ sleep = 1.5 }]
checks = [
  { command = "capture-pane -p -N -T -E 1" },
  { command = "capture-pane -p -J -E 1" },
]

[[cases]]
name = "show_hooks_g_lists_the_hooks_tmxr_fires"
# tmux lists every hook in its session table; tmxr leaves out the one it
# does not fire (after-queue), as set-hook refuses it. The rest are in tmux's
# order.
steps = [{ run = "set-hook -g after-new-window 'display hi'" }]
checks = [{ command = "show-hooks -g" }]

[[cases]]
name = "sixel_support_is_0_in_tmxr"
# tmux built with sixel says 1; tmxr draws no sixel images.
steps = []
checks = [{ format = "#{sixel_support}" }]

[[cases]]
name = "xtversion_names_tmxr"
# tmux answers DCS >|tmux and its version; tmxr names itself and its own
# version, as its #{version} does.
pane = ["raw", { print = "\u001b[>q" }, "cat"]
steps = [{ sleep = 0.5 }]
checks = [{ command = "capture-pane -p -t o" }]

[[cases]]
name = "ctrl_shift_letter_from_an_xterm_terminal_reaches_a_pane_unshifted"
# xterm under modifyOtherKeys reports Ctrl+Shift+a as CSI 27;6;65~, the
# shifted A. tmux passes the A on to a pane at level 2 (65); tmxr reads the
# key as ttyr does, a with Shift, and sends the unshifted a (97), as it does
# for a kitty terminal's Ctrl+Shift+a.
windows = "never"
attach = true
terminal = "XTerm(390)"
pane = ["raw", { print = "\u001b[>4;2m" }, "cat"]
steps = [{ sleep = 0.5 }, { keys = "\u001b[27;6;65~" }, { sleep = 0.5 }]
checks = [{ command = "capture-pane -p -t o" }]

[[cases]]
name = "caps_lock_ctrl_letter_from_an_xterm_terminal_fires_ctrl_h"
# With Caps Lock on, xterm sends Ctrl+h under modifyOtherKeys as
# CSI 27;5;72~, the upper-case H without Shift. tmux reads it as C-H, a key
# apart from C-h, so a C-h bind does not fire; ttyr reads it as Ctrl+h with
# Caps Lock, as kitty reports Caps Lock, and tmxr fires C-h's bind.
windows = "never"
attach = true
terminal = "XTerm(390)"
steps = [
  { run = "bind -n C-h set -g @k ctrl-h" },
  { run = "bind -n C-H set -g @k ctrl-upper-h" },
  { sleep = 0.5 },
  { keys = "\u001b[27;5;72~" },
  { sleep = 0.3 },
]
checks = [{ format = "#{@k}" }]

[[cases]]
name = "list_keys_prints_a_shifted_name_as_the_key_tmxr_reads"
# tmux lists each spelling as bound. tmxr makes C-S-H the C-S-h a terminal
# sends for Ctrl+Shift+h, and drops Shift written beside a character
# without Ctrl (M-S-h is M-h, S-h is h, M-S-H is M-H), as tmux's send-keys
# does for a legacy pane.
steps = [
  { run = "bind -T t C-S-H display a" },
  { run = "bind -T t M-S-h display b" },
  { run = "bind -T t S-h display c" },
  { run = "bind -T t M-S-H display d" },
]
checks = [{ command = "list-keys -T t" }]

[[cases]]
name = "send_keys_keeps_shift_beside_a_character_at_level_2"
# At modifyOtherKeys level 2 tmux sends M-S-h as CSI 27;4;104~ and S-a as
# CSI 27;2;97~, Shift kept; tmxr's key has dropped it (CSI 27;3;104~, a).
windows = "never"
pane = ["raw", { print = "\u001b[>4;2m" }, "cat"]
steps = [{ sleep = 0.5 }, { run = "send-keys -t o M-S-h S-a" }, { sleep = 0.5 }]
checks = [{ command = "capture-pane -p -t o" }]

[[cases]]
name = "a_terminal_named_as_neither_is_not_asked_for_modify_other_keys"
# tmux 3.8: WezTerm, ghostty and Rio get extended keys (from extended_keys.toml)
windows = "never"
attach = true
terminal = "WezTerm 20240203"
steps = [{ sleep = 0.5 }]
checks = [{ terminal_received = "\u001b[>4;2m", expect = false }]

[[cases]]
name = "formats_read_option_values_as_tmux"
# tmux 3.8: new default status lines 2 to 5 (from formats.toml)
steps = [
  { run = "set -g status-justify centre" },
  { run = "set -w -t o pane-status-style fg=red" },
  { run = "set -g escape-time 25" },
]
checks = [
  { format = "[#{status-justify}] [#{E:pane-status-style}] [#{escape-time}] [#{base-index}] [#{pane-status-current-style}] [#{session-status-style}] [#{nosuchoption}]" },
  { command = "show -gv session-status-current-style" },
]

[[cases]]
name = "mode_formats_as_tmux"
# tmux 3.8: theme colours in the defaults (from formats.toml)
steps = [{ run = "new-window -d -t o:1 -n second" }]
checks = [
  { command = "display -p '#{buffer_mode_format}'" },
  { command = "display -p '#{client_mode_format}'" },
  { command = "display -p '#{tree_mode_format}'" },
  { command = "display -p -t o '#{W:#{E:tree_mode_format}|}'" },
  { command = "display -p '#{S:#{E:tree_mode_format}|}'" },
]

[[cases]]
name = "command_is_the_running_command_as_tmux"
# tmux 3.8: a hook's command is the one that fired it (hooks_insert_event) (from formats.toml)
steps = [
  { run = "set -gF @set '#{command}'" },
  { run = "set-hook -g after-new-window \"set -gF @hook '#{command}'\"" },
  { run = "new-window -d" },
  { sleep = 0.3 },
]
checks = [
  { command = "display -p '#{command}'" },
  { command = "list-windows -F '#{command}'" },
  { format = "#{@set} #{@hook}" },
]

[[cases]]
name = "scrolling_keeps_the_cursors_row_and_history_bottom_its_end_as_tmux"
# tmux 3.8: vi scrolling keeps the cursor on its text (from keys.toml)
# scroll-up / -down move the cursor with the view, keeping its column as
# cursor-up / -down do; history-bottom goes to the last line's end.
unix_only = true
size = [40, 12]
program = "for i in $(seq 1 40); do echo \"line $i ( foo bar.baz )\"; echo; done; printf 'last line'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 4 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -N 2 -X scroll-down" },
  { run = "set -gF @down '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position}'" },
  { run = "send-keys -t o -X scroll-up" },
  { run = "set -gF @up '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position}'" },
  { run = "send-keys -t o -X history-bottom" },
]
checks = [
  { format = "#{@down} #{@up} #{copy_cursor_x},#{copy_cursor_y} #{scroll_position}" },
]

[[cases]]
name = "a_searchs_formats_as_tmux"
# tmux 3.8: a cleared search drops its counts (window_copy_clear_marks) (from keys.toml)
# tmux's search marks, their count over the whole history, the match at
# the cursor (or just past it), and which commands clear the marks: under
# vi keys a cursor move keeps them, begin-selection does not.
unix_only = true
size = [40, 8]
program = "for i in $(seq 1 12); do echo \"foo bar $i foo\"; done; echo 'a foo-bar'; printf 'end foo'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g mode-keys vi" },
  { run = "copy-mode -t o" },
  { run = "set -gF @before '#{search_present} #{search_count}'" },
  { run = "send-keys -t o -X search-backward zzz" },
  { run = "set -gF @none '#{search_present} #{search_count} [#{search_match}]'" },
  { run = "send-keys -t o -X search-backward foo" },
  { run = "send-keys -t o -N 3 -X cursor-right" },
  { run = "set -gF @found '#{search_present} #{search_count} [#{search_match}] [#{copy_cursor_line}]'" },
  { run = "send-keys -t o -X cursor-right" },
  { run = "set -gF @past '#{search_present} [#{search_match}]'" },
  { run = "send-keys -t o -X begin-selection" },
]
checks = [
  { format = "#{@before} | #{@none} | #{@found} | #{@past} | #{search_present} #{search_count} #{search_count_partial} #{search_timed_out}" },
]

[[cases]]
name = "emacs_keys_clear_a_searchs_marks_on_a_move_as_tmux"
# tmux 3.8: a cleared search drops its counts (window_copy_clear_marks) (from keys.toml)
unix_only = true
size = [40, 8]
program = "for i in $(seq 1 12); do echo \"foo bar $i foo\"; done; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g mode-keys emacs" },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X search-backward foo" },
  { run = "send-keys -t o -X toggle-position" },
  { run = "set -gF @kept '#{search_present}'" },
  { run = "send-keys -t o -X cursor-down" },
]
checks = [
  { format = "#{@kept} #{search_present} #{search_count}" },
]

[[cases]]
name = "copied_text_under_vi_keys_as_tmux"
# tmux 3.8: vi copy mode keeps the cursor off the cell past the text (window_copy_update_cursor) (from keys.toml)
# tmux's window_copy_get_selection: under vi keys the cell at the end is
# copied and a selection past its last line's text keeps the newline;
# under emacs keys neither. copy-line clears the selection after.
unix_only = true
size = [30, 10]
program = "printf 'short\\nhello world  \\nabcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ\\n\\n  indented line\\nlast'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g mode-keys vi" },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X -N 2 cursor-right" },
  { run = "send-keys -t o -X copy-selection" },
  { run = "set -gF @char '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X copy-line" },
  { run = "set -gF @line '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "send-keys -t o -X -N 2 cursor-right" },
  { run = "send-keys -t o -X copy-end-of-line" },
  { run = "set -gF @eol '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "send-keys -t o -X end-of-line" },
  { run = "send-keys -t o -X copy-selection" },
  { run = "set -gF @wrapped '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X -N 2 cursor-down" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X -N 2 cursor-down" },
  { run = "send-keys -t o -X copy-selection" },
  { run = "set -gF @rows '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X -N 2 cursor-down" },
  { run = "send-keys -t o -X -N 3 cursor-right" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X -N 2 cursor-up" },
  { run = "send-keys -t o -X copy-selection" },
  { run = "set -gF @up '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X -N 2 cursor-down" },
  { run = "send-keys -t o -X -N 3 cursor-right" },
  { run = "send-keys -t o -X rectangle-toggle" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "send-keys -t o -X -N 2 cursor-left" },
  { run = "send-keys -t o -X copy-selection" },
  { run = "send-keys -t o -X rectangle-toggle" },
  { run = "set -gF @rect '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -X cursor-right" },
  { run = "send-keys -t o -X copy-line" },
  { run = "set -gF @kept '#{buffer_size}:#{buffer_sample} #{selection_present}'" },
]
checks = [
  { format = "#{@char} | #{@line} | #{@eol} | #{@wrapped} | #{@rows} | #{@up} | #{@rect} | #{@kept}" },
]

[[cases]]
name = "line_and_word_selections_move_by_lines_as_tmux"
# tmux 3.8: vi copy mode keeps the cursor off the cell past the text (window_copy_update_cursor) (from keys.toml)
# tmux's lineflag: after select-line or select-word a move up or down puts
# the cursor at its line's end, or its start once the selection is turned
# round at its first line; the ends keep their words and lines.
unix_only = true
size = [30, 8]
program = "for i in $(seq 1 20); do echo \"line $i has some words\"; echo \"  short $i\"; done; printf end; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g mode-keys vi" },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X select-line" },
  { run = "send-keys -t o -X cursor-up" },
  { run = "set -gF @lineup '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X clear-selection" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X select-line" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "set -gF @linedown '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X clear-selection" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X select-line" },
  { run = "send-keys -t o -X cursor-up" },
  { run = "send-keys -t o -X other-end" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "set -gF @lineturn '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X clear-selection" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X -N 3 select-line" },
  { run = "send-keys -t o -X history-top" },
  { run = "set -gF @lines3 '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X clear-selection" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X select-word" },
  { run = "send-keys -t o -X cursor-up" },
  { run = "set -gF @wordup '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X clear-selection" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X select-word" },
  { run = "send-keys -t o -X cursor-up" },
  { run = "send-keys -t o -X other-end" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "set -gF @wordturn '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X clear-selection" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 10 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -X select-word" },
  { run = "send-keys -t o -X cursor-up" },
