# Known differences from tmux: run and reported by known_divergences_report,
# never failing. Move a case to its corpus file once it matches.

[[cases]]
name = "an_escape_and_a_click_in_one_read_are_typed"
# tmux reads ESC ESC [<2;6;6M as Alt+Escape and then typed text, and so
# passes it all to the program; no click. tmxr's client parses its input
# with crossterm, which drops what is left of a read once it has an event, so
# it reads ESC ESC then the click; a lone Alt+Escape matches (keys.toml).
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [{ sleep = 0.5 }, { keys = "\u001b\u001b[<2;6;6M" }, { sleep = 0.5 }]
checks = [
  { screen_contains = "^[^[[<2;6;6M", expect = true },
  { format = "#{window_panes}", expect = "1" },
]

[[cases]]
name = "capture_pane_t_counts_an_erased_cell_as_written"
# tmux's cellused counts a cell erased inside what was written (here the c
# of abc, erased by EL), so -N -T and -J keep it as a space (a line follows,
# as the oracle trims a capture's end); vt100 keeps an
# erased cell as one never written, so tmxr's Line::used stops at the b.
program = 'sleep 0.5; printf "abc\033[1D\033[K\nend\n"; exec sleep 1000'
steps = [{ sleep = 1.5 }]
checks = [
  { command = "capture-pane -p -N -T -E 1" },
  { command = "capture-pane -p -J -E 1" },
]

[[cases]]
name = "show_hooks_g_lists_the_hooks_tmxr_fires"
# tmux lists every hook in its session table; tmxr leaves out the three it
# does not fire (after-queue, client-light-theme, client-dark-theme), as
# set-hook refuses them. The rest are in tmux's order.
steps = [{ run = "set-hook -g after-new-window 'display hi'" }]
checks = [{ command = "show-hooks -g" }]

[[cases]]
name = "sixel_support_is_0_in_tmxr"
# tmux built with sixel says 1; tmxr draws no sixel images.
steps = []
checks = [{ format = "#{sixel_support}" }]
