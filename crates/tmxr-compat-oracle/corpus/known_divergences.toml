# Known differences from tmux: run and reported by known_divergences_report,
# never failing. Move a case to its corpus file once it matches.

[[cases]]
name = "an_escape_and_a_click_in_one_read_are_typed"
# tmux reads ESC ESC [<2;6;6M as Alt+Escape and then typed text, and so
# passes it all to the program; no click. tmxr's client parses its input
# with crossterm, which drops what is left of a read once it has an event, so
# it reads ESC ESC then the click; a lone Alt+Escape matches (keys.toml).
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [{ sleep = 0.5 }, { keys = "\u001b\u001b[<2;6;6M" }, { sleep = 0.5 }]
checks = [
  { screen_contains = "^[^[[<2;6;6M", expect = true },
  { format = "#{window_panes}", expect = "1" },
]
