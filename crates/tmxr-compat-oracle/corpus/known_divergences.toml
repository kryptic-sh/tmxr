[[cases]]
name = "scrollbars_modal_in_copy_mode"
# tmux 3.8: scrollbars overlay the pane rather than narrow it (from layout.toml)
steps = [
  { run = "set -g pane-scrollbars modal" },
  { run = "set -g pane-scrollbars-position left" },
  { run = "set -g pane-scrollbars-style bg=black,fg=white,width=2,pad=1" },
  { run = "split-window -h -t o" },
  { run = "copy-mode -t o:0.0" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "3+47\n51+49" }]

[[cases]]
name = "a_slider_drag_ends_on_the_slider"
# tmux 3.8: differs for a reason not yet found (from mouse.toml)
attach = true
program = "seq 1 200; exec sleep 1000"
steps = [
  { wait_text = "200" },
  { run = "set -g pane-scrollbars on" },
  { run = "bind -n MouseDragEnd1ScrollbarSlider set -g @seen slider" },
  { sleep = 0.5 },
  { mouse = { action = "drag", at = [99, 28], to = [99, 5] } },
  { sleep = 0.5 },
]
checks = [
  { format = "#{@seen}", expect = "slider" },
  { format = "#{pane_in_mode}", expect = "1" },
  { format = "#{scroll_position}" },
]
