[[cases]]
# copy-mode -e leaves once halfpage-down or page-down reaches the bottom,
# a selection or not.
name = "copy_mode_e_leaves_at_the_bottom_as_tmux"
# tmux 3.8: copy mode stays at the bottom while selecting (from keys.toml)
pane = [{ seq = 100 }]
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -e -t o" },
  { run = "send -t o -X halfpage-up" },
  { run = "send -t o -X halfpage-down" },
  { run = "set -gF @half '#{pane_in_mode}'" },
  { run = "copy-mode -e -t o" },
  { run = "send -t o -X halfpage-up" },
  { run = "send -t o -X begin-selection" },
  { run = "send -t o -X page-down" },
  { run = "set -gF @selected '#{pane_in_mode}'" },
]
checks = [{ format = "#{@half} #{@selected}", expect = "0 0" }]

[[cases]]
name = "scrollbars_modal_in_copy_mode"
# tmux 3.8: scrollbars overlay the pane rather than narrow it (from layout.toml)
steps = [
  { run = "set -g pane-scrollbars modal" },
  { run = "set -g pane-scrollbars-position left" },
  { run = "set -g pane-scrollbars-style bg=black,fg=white,width=2,pad=1" },
  { run = "split-window -h -t o" },
  { run = "copy-mode -t o:0.0" },
]
checks = [{ command = "list-panes -t o -F '#{pane_left}+#{pane_width}'", expect = "3+47\n51+49" }]

[[cases]]
name = "window_layout_is_tmuxs_string_and_select_layout_takes_it"
# tmux 3.8: layouts are JSON (from layout.toml)
steps = [
  { run = "split-window -h -t o:0" },
  { run = "split-window -v -t o:0.1" },
  { run = "split-window -h -t o:0.0" },
  { run = "new-window -d -t o:1" },
  { run = "split-window -v -t o:1" },
  { run = "split-window -v -t o:1" },
  { run = "select-layout -t o:1 'd67e,80x24,0,0{40x24,0,0,0,39x24,41,0[39x12,41,0,1,39x11,41,13,2]}'" },
  { run = "new-window -d -t o:2" },
  { run = "split-window -h -t o:2" },
  { run = "resize-pane -Z -t o:2.0" },
]
checks = [
  { command = "display -p -t o:0 '#{window_layout}'" },
  { command = "list-panes -t o:1 -F '#{pane_index} #{pane_left},#{pane_top} #{pane_width}x#{pane_height}'" },
  { command = "display -p -t o:2 '#{window_layout} #{window_visible_layout}'" },
]

[[cases]]
name = "split_window_with_an_empty_command_makes_an_empty_pane"
# tmux 3.8: an empty pane has no pid and is not dead (from layout.toml)
steps = [
  { run = "split-window -t o ''" },
  { run = "send-keys -t o.1 typed Enter" },
  { sleep = 0.3 },
]
checks = [
  { command = "list-panes -t o -F '#{pane_index} #{?#{==:#{pane_pid},0},none,pid} #{pane_dead} #{cursor_flag}'" },
  { command = "capture-pane -p -t o.1" },
]

[[cases]]
name = "a_slider_drag_ends_on_the_slider"
# tmux 3.8: differs for a reason not yet found (from mouse.toml)
attach = true
program = "seq 1 200; exec sleep 1000"
steps = [
  { wait_text = "200" },
  { run = "set -g pane-scrollbars on" },
  { run = "bind -n MouseDragEnd1ScrollbarSlider set -g @seen slider" },
  { sleep = 0.5 },
  { mouse = { action = "drag", at = [99, 28], to = [99, 5] } },
  { sleep = 0.5 },
]
checks = [
  { format = "#{@seen}", expect = "slider" },
  { format = "#{pane_in_mode}", expect = "1" },
  { format = "#{scroll_position}" },
]

[[cases]]
name = "a_key_after_a_click_counts_toward_a_paste_as_tmux"
# tmux 3.8: no paste guessing when the terminal brackets pastes (from mouse.toml)
attach = true
unix_only = true
program = "exec sleep 1000"
steps = [
  { run = "set -g mouse on" },
  { run = "set -g assume-paste-time 500" },
  { run = "bind -n x set -ga @hits x" },
  { sleep = 0.7 },
  { mouse = { action = "click", at = [5, 5] } },
  { keys = "x" },
  { keys = "x" },
  { sleep = 0.6 },
]
checks = [{ format = "[#{@hits}]" }]

[[cases]]
name = "show_options_quotes_strings_as_tmux"
# tmux 3.8: theme colours in the defaults (from options.toml)
steps = [
  { run = "set -g @a 'a b'" },
  { run = "set -g @b \"it's\"" },
  { run = "set -g @c 'x\"y'" },
  { run = "set -g @d '~/x'" },
  { run = "set -g @e ''" },
  { run = "set -t o status-left '[#S] '" },
  { run = "set -wg clock-mode-colour '#ff0000'" },
  { run = "set -g prefix C-a" },
  { run = "set -w -t o:0 window-status-format '#I #W'" },
]
checks = [
  { command = "show -g @a", expect = '@a "a b"' },
  { command = "show -g @b", expect = "@b \"it's\"" },
  { command = "show -g @c", expect = "@c 'x\"y'" },
  { command = "show -g @d", expect = '@d \~/x' },
  { command = "show -g @e", expect = "@e ''" },
  { command = "show -t o status-left", expect = 'status-left "[#S] "' },
  { command = "show -wg clock-mode-colour", expect = "clock-mode-colour #ff0000" },
  { command = "show -g prefix", expect = "prefix C-a" },
  { command = "show -w -t o:0 window-status-format", expect = 'window-status-format "#I #W"' },
]

