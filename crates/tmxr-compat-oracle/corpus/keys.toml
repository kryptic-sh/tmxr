[[cases]]
name = "scrolling_keeps_the_cursors_row_and_history_bottom_its_end_as_tmux"
# scroll-up / -down move the cursor with the view, keeping its column as
# cursor-up / -down do; history-bottom goes to the last line's end.
unix_only = true
size = [40, 12]
program = "for i in $(seq 1 40); do echo \"line $i ( foo bar.baz )\"; echo; done; printf 'last line'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 4 -X cursor-down" },
  { run = "send-keys -t o -N 7 -X cursor-right" },
  { run = "send-keys -t o -N 2 -X scroll-down" },
  { run = "set -gF @down '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position}'" },
  { run = "send-keys -t o -X scroll-up" },
  { run = "set -gF @up '#{copy_cursor_x},#{copy_cursor_y} #{scroll_position}'" },
  { run = "send-keys -t o -X history-bottom" },
]
checks = [
  { format = "#{@down} #{@up} #{copy_cursor_x},#{copy_cursor_y} #{scroll_position}" },
]

[[cases]]
name = "selection_formats_and_other_end_as_tmux"
# tmux keeps where a selection began and where it ends; other-end moves
# the cursor between them without swapping them.
unix_only = true
size = [40, 12]
program = "for i in $(seq 1 40); do echo \"line $i ( foo bar.baz )\"; done; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -N 2 -X cursor-down" },
  { run = "send-keys -t o -N 5 -X cursor-right" },
  { run = "send-keys -t o -X begin-selection" },
  { run = "send-keys -t o -N 2 -X cursor-right" },
  { run = "set -gF @begun '#{selection_present}#{selection_active} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X other-end" },
  { run = "send-keys -t o -X cursor-down" },
  { run = "set -gF @swapped '#{copy_cursor_x},#{copy_cursor_y} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X stop-selection" },
  { run = "send-keys -t o -X cursor-left" },
  { run = "set -gF @stopped '#{selection_present}#{selection_active} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}'" },
  { run = "send-keys -t o -X other-end" },
]
checks = [
  { format = "#{@begun} | #{@swapped} | #{@stopped} | #{copy_cursor_x},#{copy_cursor_y} #{selection_present}#{selection_active} #{selection_start_x}.#{selection_start_y}-#{selection_end_x}.#{selection_end_y}" },
]

[[cases]]
name = "a_searchs_formats_as_tmux"
# tmux's search marks, their count over the whole history, the match at
# the cursor (or just past it), and which commands clear the marks: under
# vi keys a cursor move keeps them, begin-selection does not.
unix_only = true
size = [40, 8]
program = "for i in $(seq 1 12); do echo \"foo bar $i foo\"; done; echo 'a foo-bar'; printf 'end foo'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g mode-keys vi" },
  { run = "copy-mode -t o" },
  { run = "set -gF @before '#{search_present} #{search_count}'" },
  { run = "send-keys -t o -X search-backward zzz" },
  { run = "set -gF @none '#{search_present} #{search_count} [#{search_match}]'" },
  { run = "send-keys -t o -X search-backward foo" },
  { run = "send-keys -t o -N 3 -X cursor-right" },
  { run = "set -gF @found '#{search_present} #{search_count} [#{search_match}] [#{copy_cursor_line}]'" },
  { run = "send-keys -t o -X cursor-right" },
  { run = "set -gF @past '#{search_present} [#{search_match}]'" },
  { run = "send-keys -t o -X begin-selection" },
]
checks = [
  { format = "#{@before} | #{@none} | #{@found} | #{@past} | #{search_present} #{search_count} #{search_count_partial} #{search_timed_out}" },
]

[[cases]]
name = "emacs_keys_clear_a_searchs_marks_on_a_move_as_tmux"
unix_only = true
size = [40, 8]
program = "for i in $(seq 1 12); do echo \"foo bar $i foo\"; done; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "set -g mode-keys emacs" },
