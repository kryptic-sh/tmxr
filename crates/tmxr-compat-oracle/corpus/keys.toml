[[cases]]
name = "top_middle_and_bottom_line_go_to_a_rows_start_as_tmux"
unix_only = true
size = [20, 5]
program = "printf 'aaaa\\nbbbb\\ncccc\\ndddd'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X top-line" },
  { run = "set -gF @top '#{copy_cursor_x},#{copy_cursor_y}'" },
  { run = "send-keys -t o -X end-of-line" },
  { run = "send-keys -t o -X middle-line" },
  { run = "set -gF @middle '#{copy_cursor_x},#{copy_cursor_y}'" },
  { run = "send-keys -t o -X end-of-line" },
  { run = "send-keys -t o -X bottom-line" },
]
