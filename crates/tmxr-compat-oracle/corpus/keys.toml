[[cases]]
name = "list_keys_prints_commands_as_tmux"
steps = [
  { run = "bind -T mytab a display hi" },
  { run = "bind -T mytab b set -g @x 1 \\; display 'a b'" },
  { run = "bind -T mytab c splitw -h -c '#{pane_current_path}'" },
]
checks = [{ command = "list-keys -T mytab" }, { command = "list-keys -aN -T mytab" }]

[[cases]]
name = "select_word_then_moving_grows_by_words"
program = "printf 'alpha beta gamma delta\nsecond line here\nthird line\n'; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send -t o -X history-top" },
  { run = "send -t o -X -N 12 cursor-right" },
  { run = "send -t o -X select-word" },
  { run = "send -t o -X cursor-right" },
  { run = "send -t o -X next-word" },
  { run = "send -t o -X copy-selection" },
]
checks = [{ command = "show-buffer" }]

