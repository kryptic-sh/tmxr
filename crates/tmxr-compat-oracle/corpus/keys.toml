[[cases]]
name = "command_prompt_vi_keys"
attach = true
unix_only = true
steps = [
  { run = "set -g status-keys vi" },
  { run = "command-prompt -b -I 'one two three' \"set -g @r '%%'\"" },
  { sleep = 0.3 },
  { keys = "\u001b" },
  { sleep = 0.6 },
  { keys = "bx0wiX" },
  { sleep = 0.2 },
  { keys = "\u000d" },
