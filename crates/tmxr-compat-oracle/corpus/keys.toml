# What a pane's program gets for keys from the client's terminal, as `cat -v`
# shows it on a raw terminal.

[[cases]]
name = "alt_escape_reaches_the_program"
# A terminal sends Alt+Escape as ESC ESC; tmux passes both on.
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [{ sleep = 0.5 }, { keys = "\u001bx\u001b\u001b" }, { sleep = 0.5 }]
checks = [{ screen_contains = "^[x^[^[", expect = true }]

[[cases]]
name = "send_keys_h_sends_bytes_and_n_repeats"
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [
  { sleep = 0.5 },
  { run = "send-keys -t o -H 41 1b zz 7f 42" },
  { run = "send-keys -t o -N 3 ab Enter" },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o", expect = "A^[^?Bab^Mab^Mab^M" },
]

[[cases]]
name = "select_pane_d_turns_a_panes_input_off_and_e_on"
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [
  { sleep = 0.5 },
  { run = "split-window -t o 'stty raw -echo; exec cat -v'" },
  { sleep = 0.5 },
  { run = "select-pane -d -t o.0" },
  { run = "send-keys -t o.0 abc" },
  { run = "set-buffer pb" },
  { run = "paste-buffer -t o.0" },
  { run = "select-pane -e -t o.0" },
  { run = "send-keys -t o.0 xyz" },
  { run = "select-pane -d -t o.1" },
  { run = "send-keys -t o.1 abc" },
  { run = "select-pane -t o.0" },
  { run = "last-pane -e -t o" },
  { run = "send-keys -t o.1 def" },
  { run = "last-pane -d -t o" },
  { sleep = 0.5 },
]
checks = [
  { command = "capture-pane -p -t o.0", expect = "xyz" },
  { command = "capture-pane -p -t o.1", expect = "def" },
  { command = "display -p -t o.0 '#{pane_input_off}'", expect = "0" },
  { command = "display -p -t o.1 '#{pane_input_off}'", expect = "1" },
  { command = "display -p -t o '#{pane_index}'", expect = "0" },
]

[[cases]]
name = "list_keys_in_tmuxs_order_and_layout"
steps = [
  { run = "unbind -a" },
  { run = "unbind -a -T root" },
  { run = "bind -N 'note a' a display-message a" },
  { run = "bind -N 'ctrl b' C-b send-prefix" },
  { run = "bind -N 'meta x' M-x display-message mx" },
  { run = "bind -N 'up arrow' Up display-message up" },
  { run = "bind -N 'space bar' Space display-message sp" },
  { run = "bind -N quote '\"' display-message q" },
  { run = "bind -r -N 'f one' F1 display-message f1" },
  { run = "bind -n -N 'root z' z display-message rz" },
  { run = "bind -n M-y display-message rmy" },
  { run = "bind -n MouseDown1Pane select-pane" },
  { run = "bind -T mytab Enter display-message e" },
]
checks = [
  { command = "list-keys -N" },
  { command = "list-keys -aN" },
  { command = "list-keys -N -P '>> '" },
  { command = "list-keys -N -T root" },
  { command = "list-keys -T prefix" },
  { command = "list-keys -T root" },
  { command = "list-keys -T mytab" },
  { command = "list-keys -T prefix F1" },
]

[[cases]]
name = "send_keys_r_resets_the_panes_terminal"
program = 'printf "hello\nworld\033[?1h\033[?25l"; exec sleep 1000'
steps = [{ sleep = 0.5 }, { run = "send-keys -R -t o" }, { sleep = 0.5 }]
checks = [
