  { run = "set -gF @kept '#{search_present}'" },
  { run = "send-keys -t o -X cursor-down" },
]
checks = [
  { format = "#{@kept} #{search_present} #{search_count}" },
]

[[cases]]
name = "an_incremental_search_without_a_prefix_searches_nothing_as_tmux"
