# List commands with -F and -f, on a second session, window and a buffer.

[[cases]]
name = "list_commands_take_formats_and_filters"
steps = [
  { run = "new-window -d -t o:1" },
  { run = "new-session -d -s b -x 100 -y 30" },
  { run = "split-window -h -t o:0" },
  { run = "set-buffer -b one 'hello world'" },
]
checks = [
  { command = "list-sessions -F '#{session_name} #{session_windows}'", expect = "b 1\no 2" },
  { command = "list-sessions -F '#{session_name}' -f '#{==:#{session_name},b}'", expect = "b" },
  { command = "list-windows -a -F '#{session_name}:#{window_index}'", expect = "b:0\no:0\no:1" },
  { command = "list-panes -s -t o -F '#{window_index}.#{pane_index}'", expect = "0.0\n0.1\n1.0" },
  { command = "list-panes -a -F '#{session_name}:#{window_index}.#{pane_index}' -f '#{pane_active}'", expect = "b:0.0\no:0.1\no:1.0" },
  { command = "list-buffers -F '#{buffer_name} #{buffer_size} #{buffer_sample}'", expect = "one 11 hello world" },
]

[[cases]]
name = "tilde_and_marked_name_the_marked_pane"
steps = [
  { run = "split-window -t o:0" },
  { run = "select-pane -m -t o:0.0" },
  { run = "new-window -d -t o:1" },
  { run = "select-window -t o:1" },
]
checks = [
  { command = "display -p -t '~' '#{window_index}.#{pane_index} #{pane_marked}'", expect = "0.0 1" },
  { command = "display -p -t '{marked}' '#S:#{window_index}.#{pane_index}'", expect = "o:0.0" },
  { command = "list-panes -t '~' -F '#{pane_index}'", expect = "0\n1" },
  { command = "list-windows -t '{marked}' -F '#I'", expect = "0\n1" },
]

[[cases]]
name = "targets_find_names_by_prefix_pattern_or_exactly"
steps = [
  { run = "new-session -d -s foobar" },
  { run = "new-session -d -s qux" },
  { run = "new-window -d -t foobar -n main" },
]
checks = [
  { command = "list-windows -t foo -F '#S'", expect = "foobar\nfoobar" },
  { command = "list-windows -t 'f*r' -F '#S'", expect = "foobar\nfoobar" },
  { command = "list-windows -t '=foobar' -F '#S'", expect = "foobar\nfoobar" },
  { command = "display -p -t 'foobar:=main' '#W'", expect = "main" },
  { command = "display -p -t 'foobar:ma*' '#W'", expect = "main" },
  { command = "display -p -t 'foobar:=1' '#W'", expect = "main" },
]

[[cases]]
name = "new_window_a_and_b_move_later_windows_up"
steps = [
  { run = "new-session -d -s w -n a" },
  { run = "new-window -d -t w:1 -n b" },
  { run = "new-window -d -t w:2 -n c" },
  { run = "new-window -d -a -t w:0 -n x" },
  { run = "new-window -d -b -t w:0 -n y" },
]
checks = [
  { command = "list-windows -t w -F '#I #W #{window_active}'", expect = "0 y 0\n1 a 1\n2 x 0\n3 b 0\n4 c 0" },
]

[[cases]]
name = "move_and_link_window_a_and_b_move_later_windows_up"
steps = [
  { run = "rename-window -t o:0 z" },
  { run = "new-session -d -s w -n a" },
  { run = "new-window -d -t w:1 -n b" },
  { run = "new-window -d -t w:2 -n c" },
  { run = "new-window -d -a -t w:0 -n x" },
  { run = "new-window -d -b -t w:0 -n y" },
  { run = "move-window -a -s w:c -t w:0" },
  { run = "move-window -d -b -s w:y -t w:b" },
  { run = "link-window -d -a -s o:0 -t w:5" },
]
checks = [
  { command = "list-windows -t w -F '#I #W #{window_active}'", expect = "1 c 1\n2 a 0\n3 x 0\n4 y 0\n5 b 0\n6 z 0" },
]

[[cases]]
name = "a_pane_id_names_its_window_and_session"
steps = [{ run = "new-window -d -t o:1 -n w1" }, { run = "rename-window -t %0 named" }]
checks = [
  { command = "list-windows -t %0 -F '#S #I #W'", expect = "o 0 named\no 1 w1" },
  { command = "display -p -t o:0 '#W'", expect = "named" },
  { command = "list-windows -t @0 -F '#S'", expect = "o\no" },
]

[[cases]]
name = "new_window_k_replaces_and_s_selects_by_name"
steps = [
  { run = "new-session -d -s nk -n first" },
  { run = "new-window -d -t nk:1 -n one" },
  { run = "new-window -d -k -t nk:1 -n uno" },
  { run = "select-window -t nk:1" },
  { run = "new-window -S -n first -t nk" },
  { run = "new-window -S -n fresh -t nk" },
  { run = "new-session -d -s kc -n a" },
  { run = "new-window -t kc:1 -n b" },
  { run = "new-window -d -k -t kc:1 -n c" },
]
checks = [
  { command = "list-windows -t nk -F '#I #W #{window_active}'", expect = "0 first 0\n1 uno 0\n2 fresh 1" },
  { command = "list-windows -t kc -F '#I #W #{window_active}'", expect = "0 a 0\n1 c 1" },
]

[[cases]]
name = "set_buffer_w_t_with_no_such_client_still_sets_the_buffer"
steps = [{ run = "set-buffer -w -t nosuch zqbuf" }]
checks = [{ command = "show-buffer", expect = "zqbuf" }, { command = "set-buffer -w -t nosuch again" }]

[[cases]]
# -a appends only to the buffer -b names; without -b it is a new buffer.
# (Deleting one that is not there is an error, which the e2e tests check.)
name = "set_buffer_a_appends_only_to_a_named_buffer"
steps = [
  { run = "set-buffer -b one one" },
  { run = "set-buffer -a two" },
  { run = "set-buffer -a -b one more" },
]
checks = [
  { command = "list-buffers -F '#{buffer_sample}'", expect = "onemore\ntwo" },
]

[[cases]]
name = "session_groups_share_their_windows_as_tmux"
steps = [
  { run = "new-window -d -t o:1" },
  { run = "new-session -d -t o" },
  { run = "new-session -d -t o -s named" },
  { run = "new-window -d -t named:5" },
  { run = "select-window -t o:1" },
  { run = "kill-window -t o-1:1" },
  { run = "new-session -d -t brandnew" },
  { run = "new-session -d -s alone" },
]
checks = [
  { command = "list-sessions -F '#{session_name}: #{session_windows} [#{session_group}] #{session_grouped} #{session_group_size} [#{session_group_list}] #{window_index}'" },
  { command = "list-windows -t o-1 -F '#{window_index} #{window_active}'" },
]

[[cases]]
name = "a_session_group_outlives_a_killed_member_as_tmux"
steps = [
  { run = "new-window -d -t o:3" },
  { run = "new-session -d -t o" },
  { run = "kill-session -t o" },
  { run = "new-window -d -t o-1:7" },
]
checks = [
  { command = "list-sessions -F '#{session_name}: #{session_windows} [#{session_group}] #{session_grouped} #{session_group_size} [#{session_group_list}] #{window_index}'" },
  { command = "list-windows -a -F '#{session_name}:#{window_index}'" },
]

[[cases]]
# A bare number is a pane of the current window when it has one, else a
# window (its active pane).
name = "a_bare_number_target_falls_back_to_a_window"
steps = [{ run = "new-window -d -t o:1" }, { run = "new-window -d -t o:3" }]
checks = [
  { command = "display -p -t 1 '#{window_index}.#{pane_index}'", expect = "1.0" },
  { command = "display -p -t 3 '#{window_index}.#{pane_index}'", expect = "3.0" },
  { command = "split-window -d -t o:0" },
  { command = "display -p -t 1 '#{window_index}.#{pane_index}'", expect = "0.1" },
]

[[cases]]
# A destination's +N / -N counts from the current window.
name = "a_destination_offset_counts_from_the_current_window"
steps = [
  { run = "rename-window -t o:0 zero" },
  { run = "new-window -t o:2 -n two" },
  { run = "new-window -d -t +1 -n p1" },
  { run = "new-window -d -t o:+3 -n p3" },
  { run = "new-window -d -t o:-1 -n m1" },
]
checks = [
  { command = "list-windows -t o -F '#I #W'", expect = "0 zero\n1 m1\n2 two\n3 p1\n5 p3" },
]

[[cases]]
# A window or pane id in a session group names the member active last.
name = "an_id_in_a_group_names_the_session_active_last"
steps = [{ run = "new-session -d -t o -s member" }]
checks = [
  { command = "display -p -t @0 '#S'", expect = "member" },
  { command = "display -p -t %0 '#S'", expect = "member" },
]
