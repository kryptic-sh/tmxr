# What paste-buffer sends a program, as `cat -v` shows it on a raw terminal:
# ^M for a carriage return, ^[[200~ / ^[[201~ for bracketed paste's marks.

[[cases]]
name = "paste_buffer_sends_returns_for_newlines"
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [
  { sleep = 0.5 },
  { run = "set-buffer 'one\ntwo'" },
  { run = "paste-buffer -t o" },
]
checks = [{ screen_contains = "one^Mtwo", expect = true }]

[[cases]]
name = "paste_buffer_takes_a_separator"
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [
  { sleep = 0.5 },
  { run = "set-buffer 'one\ntwo'" },
  { run = "paste-buffer -s , -t o" },
]
checks = [{ screen_contains = "one,two", expect = true }]

[[cases]]
name = "paste_buffer_r_keeps_newlines"
attach = true
unix_only = true
program = "stty raw -echo; exec cat -v"
steps = [
  { sleep = 0.5 },
  { run = "set-buffer 'one\ntwo'" },
  { run = "paste-buffer -r -t o" },
]
checks = [
  { screen_contains = "two", expect = true },
  { screen_contains = "^M", expect = false },
]

[[cases]]
name = "paste_buffer_brackets_only_with_p"
attach = true
unix_only = true
program = "printf '\\033[?2004h'; stty raw -echo; exec cat -v"
steps = [
  { sleep = 0.5 },
  { run = "set-buffer plain" },
  { run = "paste-buffer -t o" },
  { run = "set-buffer marked" },
  { run = "paste-buffer -p -t o" },
]
checks = [
  { screen_contains = "plain^[[200~marked^[[201~", expect = true },
]

[[cases]]
name = "set_buffer_n_renames_a_buffer"
steps = [
  { run = "set-buffer -b a xa" },
  { run = "set-buffer xtop" },
  { run = "set-buffer -n renamed" },
  { run = "set-buffer -b a -n b" },
  { run = "set-buffer -b c xc" },
  { run = "set-buffer -b c -n renamed" },
]
checks = [
  { command = "list-buffers -F '#{buffer_name}=#{buffer_sample}'", expect = "renamed=xc\nb=xa" },
]

[[cases]]
name = "copy_line_copies_whole_lines_and_keeps_the_cursor"
unix_only = true
size = [20, 6]
program = "seq 1 60; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X cursor-up" },
  { run = "send-keys -t o -X copy-line" },
  { run = "send-keys -t o -X cursor-up" },
  { run = "send-keys -t o -N 2 -X copy-line" },
]
checks = [
  { command = "show-buffer -b buffer0", expect = "60" },
  { command = "show-buffer -b buffer1", expect = "59\n60" },
  { format = "#{pane_in_mode} #{copy_cursor_y}" },
]

[[cases]]
name = "scroll_top_and_bottom_move_the_view_only_when_they_can"
unix_only = true
size = [20, 6]
program = "seq 1 60; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o" },
  { run = "send-keys -t o -X history-top" },
  { run = "send-keys -t o -X scroll-bottom" },
  { run = "send-keys -t o -N 7 -X cursor-down" },
  { run = "send-keys -t o -X scroll-top" },
]
checks = [
  { format = "#{scroll_position} #{copy_cursor_y}" },
]

[[cases]]
name = "and_cancel_motions_leave_copy_mode_at_the_bottom"
unix_only = true
size = [20, 6]
program = "seq 1 60; exec sleep 1000"
steps = [
  { sleep = 0.5 },
  { run = "copy-mode -t o:0" },
  { run = "send-keys -t o:0 -X cursor-up" },
  { run = "send-keys -t o:0 -X scroll-down-and-cancel" },
  { run = "new-window -d -t o:1 'seq 1 60; exec sleep 1000'" },
  { sleep = 0.5 },
  { run = "copy-mode -t o:1" },
  { run = "send-keys -t o:1 -X page-up" },
  { run = "send-keys -t o:1 -X page-up" },
  { run = "send-keys -t o:1 -X page-down-and-cancel" },
  { run = "new-window -d -t o:2 'seq 1 60; exec sleep 1000'" },
  { sleep = 0.5 },
  { run = "copy-mode -t o:2" },
  { run = "send-keys -t o:2 -X cursor-up" },
  { run = "send-keys -t o:2 -X cursor-down-and-cancel" },
  { run = "new-window -d -t o:3 'seq 1 60; exec sleep 1000'" },
  { sleep = 0.5 },
  { run = "copy-mode -t o:3" },
  { run = "send-keys -t o:3 -X cursor-down-and-cancel" },
]
checks = [
  { command = "display -p -t o:0 '#{pane_in_mode}'", expect = "0" },
  { command = "display -p -t o:1 '#{pane_in_mode} #{scroll_position}'" },
  { command = "display -p -t o:2 '#{pane_in_mode}'", expect = "1" },
  { command = "display -p -t o:3 '#{pane_in_mode}'", expect = "0" },
]

