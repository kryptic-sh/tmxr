# Where popups and menus go: the corner tmux 3.6 drew for the same steps,
# a 100x30 client with its window split left/right (the right pane active).

[[cases]]
name = "popup_r_s"
attach = true
unix_only = true
steps = [
  { run = "split-window -h -t o" },
  { spawn = "display-popup -x R -y S -w 20 -h 5 'sleep 30'" },
]
checks = [{ screen_find = "┌", expect = "80,24" }]

[[cases]]
name = "popup_number_formats"
attach = true
unix_only = true
steps = [
  { run = "split-window -h -t o" },
  { spawn = "display-popup -x '#{pane_index}' -y 3 -w 20 -h 5 'sleep 30'" },
]
checks = [{ screen_find = "┌", expect = "1,0" }]

