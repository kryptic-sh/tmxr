# Which keys close a popup, and display-popup on one already open.

[[cases]]
name = "a_finished_popup_ignores_q"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup 'echo POPDONE'" },
  { wait_text = "POPDONE" },
  { keys = "q" },
  { sleep = 0.5 },
]
checks = [{ screen_contains = "POPDONE", expect = true }]

[[cases]]
name = "escape_closes_a_finished_popup"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup 'echo POPDONE'" },
  { wait_text = "POPDONE" },
  { keys = "\u001b" },
  { sleep = 0.5 },
]
checks = [{ screen_contains = "POPDONE", expect = false }]

[[cases]]
name = "k_lets_any_key_close_a_finished_popup"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup -k 'echo POPDONE'" },
  { wait_text = "POPDONE" },
  { keys = "q" },
  { sleep = 0.5 },
]
checks = [{ screen_contains = "POPDONE", expect = false }]

[[cases]]
name = "escape_closes_a_running_popup_without_e"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup 'echo POPRUN; sleep 30'" },
  { wait_text = "POPRUN" },
  { keys = "\u001b" },
  { sleep = 0.5 },
]
checks = [{ screen_contains = "POPRUN", expect = false }]

[[cases]]
name = "escape_goes_to_a_running_popup_with_e"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup -E 'echo POPRUN; sleep 30'" },
  { wait_text = "POPRUN" },
  { keys = "\u001b" },
  { sleep = 0.5 },
]
checks = [{ screen_contains = "POPRUN", expect = true }]

[[cases]]
name = "display_popup_retitles_an_open_popup"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup -T First 'echo POPRUN; sleep 30'" },
  { wait_text = "First" },
  { spawn = "display-popup -T Second" },
  { sleep = 0.5 },
]
checks = [
  { screen_contains = "Second", expect = true },
  { screen_contains = "First", expect = false },
  { screen_contains = "POPRUN", expect = true },
]

[[cases]]
name = "display_popup_without_t_clears_the_title"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup -T First 'echo POPRUN; sleep 30'" },
  { wait_text = "First" },
  { spawn = "display-popup -B" },
  { sleep = 0.5 },
]
checks = [
  { screen_contains = "First", expect = false },
  { screen_contains = "POPRUN", expect = true },
  { screen_find = "┌", expect = "none" },
]

[[cases]]
name = "menu_lines_simple"
attach = true
unix_only = true
steps = [
  { spawn = "display-menu -b simple -T Title -x 1 -y 6 one a '' '' two b ''" },
  { wait_text = "two" },
]
checks = [
  { screen_contains = "+-Title---+", expect = true },
  { screen_find = "+-Title---+" },
  { screen_find = "| one (a) |" },
  { screen_find = "+---------+" },
]

[[cases]]
name = "menu_lines_single_separator"
attach = true
unix_only = true
steps = [
  { spawn = "display-menu -T Title -x 1 -y 6 one a '' '' two b ''" },
  { wait_text = "two" },
]
checks = [
  { screen_contains = "├─────────┤", expect = true },
  { screen_find = "┌─Title───┐" },
  { screen_find = "├─────────┤" },
]

[[cases]]
name = "menu_lines_padded"
attach = true
unix_only = true
steps = [
  { spawn = "display-menu -b padded -T Title -x 1 -y 6 one a '' '' two b ''" },
  { wait_text = "two" },
]
checks = [
  { screen_contains = "one (a)", expect = true },
  { screen_find = "Title" },
  { screen_find = "one (a)" },
  { screen_find = "two (b)" },
]

[[cases]]
name = "menu_lines_none_keep_the_border_cells"
attach = true
unix_only = true
steps = [
  { spawn = "display-menu -b none -T Title -x 1 -y 6 one a '' '' two b ''" },
  { wait_text = "two" },
]
checks = [
  { screen_contains = "one (a)", expect = true },
  { screen_find = "Title" },
  { screen_find = "one (a)" },
]

[[cases]]
name = "popup_lines_simple"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup -b simple -T Pop -x 1 -y 6 -w 12 -h 5 'echo BOXED; sleep 30'" },
  { wait_text = "BOXED" },
]
checks = [
  { screen_contains = "+-Pop------+", expect = true },
  { screen_find = "+-Pop------+" },
  { screen_find = "|BOXED" },
]

[[cases]]
name = "popup_lines_padded"
attach = true
unix_only = true
steps = [
  { spawn = "display-popup -b padded -T Pop -x 1 -y 6 -w 12 -h 5 'echo BOXED; sleep 30'" },
  { wait_text = "BOXED" },
]
checks = [
  { screen_contains = "Pop", expect = true },
  { screen_find = "Pop" },
  { screen_find = "BOXED" },
]


[[cases]]
name = "menu_lines_from_the_option"
attach = true
unix_only = true
steps = [
  { run = "set -g menu-border-lines simple" },
  { spawn = "display-menu -T Title -x 1 -y 6 one a '' '' two b ''" },
  { wait_text = "two" },
]
checks = [
  { screen_contains = "+-Title---+", expect = true },
  { command = "show-options -gv menu-border-lines", expect = "simple" },
]

[[cases]]
name = "menu_s_under_a_status_line_at_the_top"
attach = true
unix_only = true
steps = [
  { run = "set -g status-position top" },
  { spawn = "display-menu -T t -x 3 -y S aaa a '' bbb b ''" },
]
checks = [{ screen_find = "┌", expect = "3,1" }]
