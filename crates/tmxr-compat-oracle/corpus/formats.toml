# The format language. Expected values are tmux 3.6's display-message -p.

[[cases]]
name = "comparisons_matches_quoting_and_cuts"
steps = [{ run = "set -g @sp 'a b;c#d'" }, { run = "set -g @w hjkl" }]
checks = [
  { format = "#{>:2,10}", expect = "1" },
  { format = "#{<:a,b}", expect = "1" },
  { format = "#{<=:b,b}", expect = "1" },
  { format = "#{>=:a,b}", expect = "0" },
  { format = "#{m:*foo*,xfooy}", expect = "1" },
  { format = "#{m:f?o,foo}", expect = "1" },
  { format = "#{m:[!a]x,bx}", expect = "1" },
  { format = "#{m:[!a]x,ax}", expect = "0" },
  { format = "#{m:foo,FOO}", expect = "0" },
  { format = "#{m/i:FOO,foo}", expect = "1" },
  { format = "#{m:[a-c]z,bz}", expect = "1" },
  { format = '#{m:a\*,a*}', expect = "1" },
  { format = '#{m:a\*,ab}', expect = "0" },
  { format = "#{m/r:(copy|view)-mode,copy-mode}", expect = "1" },
  { format = "#{m/r:^view,copy-mode}", expect = "0" },
  { format = "#{m/ri:COPY,copy-mode}", expect = "1" },
  { format = "#{q:@sp}", expect = 'a\ b\;c\#d' },
  { format = "#{q/e:@sp}", expect = "a b;c##d" },
  { format = "#{=/2/...:@w}", expect = "hj..." },
  { format = "#{=/-2/...:@w}", expect = "...kl" },
  { format = "#{=/9/...:@w}", expect = "hjkl" },
  { format = "#{=2:@w}", expect = "hj" },
]

[[cases]]
name = "set_option_f_expands_the_value"
steps = [{ run = "set -gF @x '#{session_name}-#{window_index}'" }]
checks = [{ format = "#{@x}", expect = "o-0" }]

[[cases]]
name = "a_bell_flags_each_sessions_link_unless_in_sight"
attach = true
program = 'read x; printf "\a"; exec sleep 1000'
steps = [
  { run = "new-session -d -s p" },
  { run = "link-window -d -s o:0 -t p:5" },
  { run = "send-keys -t o:0 Enter" },
  { sleep = 0.5 },
]
checks = [
  { command = "display -p -t o:0 '#{window_bell_flag}'", expect = "0" },
  { command = "display -p -t p:5 '#{window_bell_flag}'", expect = "1" },
  { command = "list-windows -t p -F '#I#{window_flags}'", expect = "0*\n5!" },
]

[[cases]]
name = "value_modifiers_chain_in_tmuxs_order"
steps = [{ run = "set -g @p /home/me/src/proj" }, { run = "set -g @e ''" }]
checks = [
  { command = "display -p '#{b:@p}'", expect = "proj" },
  { command = "display -p '#{d:@p}'", expect = "/home/me/src" },
  { command = "display -p '#{s/o/0/:@p}'", expect = "/h0me/me/src/pr0j" },
  { command = "display -p '#{l:#{@p}}'", expect = "#{@p}" },
  { command = "display -p '#{n:@p}'", expect = "17" },
  { command = "display -p '#{p5:session_name}|'", expect = "o    |" },
  { command = "display -p '#{p-5:session_name}|'", expect = "    o|" },
  { command = "display -p '#{=3;b:@p}'", expect = "pro" },
  { command = "display -p '#{b;s/r/R/:@p}'", expect = "pRoj" },
  { command = "display -p '#{?@e,1,@p,2,3}'", expect = "2" },
  { command = "display -p '#{?@e,1,@e,2,3}'", expect = "3" },
]

[[cases]]
name = "display_message_l_is_literal_and_f_is_the_format"
steps = []
checks = [
  { command = "display -p -l '#{session_name}'", expect = "#{session_name}" },
  { command = "display -p -F '#{session_name}!'", expect = "o!" },
]

[[cases]]
name = "window_session_and_pane_variables_are_tmuxs"
steps = [
  { run = "set -g history-limit 3000" },
  { run = "new-window -d -t o:3" },
  { run = "new-window -d -t o:5" },
  { run = "select-window -t o:3" },
  { run = "split-window -t o:3" },
  { run = "new-session -d -s other" },
  { run = "link-window -s o:3 -t other:9" },
  { run = "select-window -t other:9" },
  # Marked after linking: tmux's link-window leaves a mark it moves invalid.
  { run = "select-pane -m -t o:3.1" },
]
checks = [
  { command = "display -p -t o:3 '#{active_window_index} #{last_window_index} #{window_start_flag} #{window_end_flag} #{window_active_sessions} #{window_marked_flag} #{session_marked} #{server_sessions} #{session_many_attached}'" },
  { command = "display -p -t o:0 '#{window_start_flag} #{window_end_flag} #{window_marked_flag} #{window_active_sessions}'" },
  { command = "display -p -t o:5 '#{window_start_flag} #{window_end_flag}'" },
  { command = "display -p -t other '#{session_marked} #{active_window_index} #{last_window_index}'" },
  { command = "display -p -t o:3.1 '#{history_limit} #{cursor_flag} #{keypad_flag} #{keypad_cursor_flag}'" },
]

[[cases]]
name = "time_variables_are_seconds_since_the_epoch"
steps = [{ run = "new-window -d -t o:1" }]
checks = [
  { format = "#{e|>|:#{start_time},1700000000} #{e|>|:#{session_created},1700000000}", expect = "1 1" },
  { command = "display -p -t o:1 '#{e|>|:#{window_activity},1700000000}'", expect = "1" },
  { format = "#{e|<=|:#{start_time},#{session_created}}", expect = "1" },
]

[[cases]]
name = "t_modifier_and_strftime_in_display_message_are_tmuxs"
steps = [
  { run = "set -g @t 1700000000" },
  # Twelve hours on: one of the two is in the afternoon in any zone.
  { run = "set -g @t12 1700043200" },
  { run = "set -g @zero 0" },
  { run = "set -g @word hello" },
]
checks = [
  { command = "display -p '#{t:@t}'" },
  { command = "display -p '#{t/f/%%a %%A %%b %%B %%C %%d %%D %%e %%F %%h %%H %%I %%j %%k %%l %%m %%M %%p %%r %%R %%s %%S %%T %%u %%w %%y %%Y %%%%:@t}'" },
  { command = "display -p '#{t/p:@t}'" },
  # Not time-expanded: t/f formats @t itself, each conversion as glibc's.
  { command = "list-windows -t o -F '#{t/f/%a %A %b %B %C %d %D %e %F %h %H %I %j %k %l %m %M %p %r %R %s %S %T %u %w %y %Y %%:@t}'" },
  { command = "list-windows -t o -F '#{t/f/%c|%P|%Q:@t}'" },
  { command = "list-windows -t o -F '#{t/f/%H %I %k %l %p %P %r:@t12}'" },
  { command = "display -p '[#{t:@zero}][#{t:@word}]'", expect = "[][]" },
  { command = "display -p '%Y %%'" },
  { command = "display -p -l '%Y'", expect = "%Y" },
]

[[cases]]
name = "strftime_sequences_fill_in_the_status_line"
attach = true
unix_only = true
steps = [
  { run = "set -g status-right 'Y=%Y|%%'" },
  { run = "set -g window-status-current-format 'W=%m'" },
  { sleep = 0.5 },
]
checks = [
  { screen_contains = "Y=%Y", expect = false },
  { screen_contains = "Y=20", expect = true },
  { screen_contains = "|%", expect = true },
  { screen_contains = "W=%m", expect = false },
]

[[cases]]
name = "pane_start_command_is_the_command_as_given"
unix_only = true
steps = [
  { run = "new-window -d -t o:1 'sleep 100'" },
  { run = "new-window -d -t o:2 sleep 100" },
  { run = "new-window -d -t o:3 sh -c 'echo \"a b\"; sleep 100'" },
  { run = "split-window -d -t o:0" },
  { run = "set -g default-command 'sleep 200'" },
  { run = "new-window -d -t o:4" },
  { run = "respawn-pane -k -t o:1" },
]
checks = [
  { command = "display -p -t o:0.0 '[#{pane_start_command}]'" },
  { command = "display -p -t o:0.1 '[#{pane_start_command}]'" },
  { command = "display -p -t o:1 '[#{pane_start_command}]'" },
  { command = "display -p -t o:2 '[#{pane_start_command}]'" },
  { command = "display -p -t o:3 '[#{pane_start_command}]'" },
  { command = "display -p -t o:4 '[#{pane_start_command}]'" },
]

[[cases]]
name = "linked_and_active_session_lists_are_tmuxs"
steps = [
  { run = "new-session -d -s b" },
  { run = "new-session -d -s a" },
  { run = "new-window -d -t a:1" },
  { run = "link-window -s a:1 -t b:5" },
  { run = "link-window -d -s a:1 -t o:7" },
]
checks = [
  { command = "display -p -t a:1 '#{window_linked_sessions} [#{window_linked_sessions_list}] [#{window_active_sessions_list}] #{window_active_sessions}'" },
  { command = "display -p -t a:0 '#{window_linked_sessions} [#{window_linked_sessions_list}] [#{window_active_sessions_list}]'" },
]

[[cases]]
name = "pane_start_path_is_where_the_pane_started"
unix_only = true
steps = [
  { run = "new-window -d -t o:1 -c /tmp" },
  { run = "split-window -d -t o:1 -c /usr" },
]
checks = [
  { command = "display -p -t o:1.0 '#{pane_start_path}'", expect = "/tmp" },
  { command = "display -p -t o:1.1 '#{pane_start_path}'", expect = "/usr" },
]

[[cases]]
name = "session_last_attached_is_empty_until_a_client_attaches"
steps = [{ run = "new-session -d -s never" }]
checks = [
  { command = "display -p -t never '[#{session_last_attached}][#{t:session_last_attached}]'", expect = "[][]" },
]

[[cases]]
name = "pane_last_is_the_previously_active_pane"
steps = [
  { run = "new-window -d -t o:1" },
  { run = "split-window -d -t o:1" },
  { run = "split-window -d -t o:1" },
  { run = "select-pane -t o:1.1" },
  { run = "select-pane -t o:1.2" },
]
checks = [
  { command = "list-panes -t o:1 -F '#{pane_index} #{pane_last} #{pane_active}'" },
]

[[cases]]
name = "session_path_is_the_sessions_directory"
unix_only = true
steps = [{ run = "new-session -d -s there -c /tmp" }]
checks = [
  { command = "display -p -t there '#{session_path}'", expect = "/tmp" },
]

[[cases]]
name = "session_alerts_list_each_alerted_window"
attach = true
program = 'read x; printf "\a"; exec sleep 1000'
steps = [
  { run = "set -g monitor-activity on" },
  { run = "new-session -d -s p" },
  { run = "link-window -d -s o:0 -t p:5" },
  { run = "new-window -d -t p:3" },
  { run = "send-keys -t o:0 Enter" },
  { sleep = 0.5 },
]
checks = [
  { command = "display -p -t p '[#{session_alert}] [#{session_alerts}]'" },
  { command = "display -p -t o '[#{session_alert}] [#{session_alerts}]'" },
]

