[[cases]]
name = "w_measures_the_width_on_screen"
steps = [
  { run = "set -g @a 'a中b'" },
  { run = "set -g @s '#[fg=red]ab##'" },
  { run = "set -g @u 'héllo wörld'" },
  { run = "set -g @e ''" },
]
checks = [
  { format = "#{w:@a}|#{w:@s}|#{w:@u}|#{n:@u}|#{w:@e}|#{w;n:@a}|#{n;w:@a}" },
]

[[cases]]
name = "e_t_q_and_m_chain_with_other_modifiers"
steps = [
  { run = "set -g @f '#{session_name}-long-text'" },
  { run = "set -g @sp 'a b;c'" },
  { run = "set -g @p '/home/me/my dir'" },
  { run = "set -g @t '%Y'" },
]
checks = [
  { format = "#{E;=5:@f}|#{=5;E:@f}|#{E;n:@f}|#{E;s/o/0/:@f}|#{E;p20:@f}|" },
  { format = "#{T;=2:@t}|#{l;E:@f}|#{E;q:@f}" },
  { format = "#{q;=3:@sp}|#{q:#{@sp}}|#{q:@sp}|#{b;q:@p}|#{q;b:@p}|#{q/e;=2:@sp}|" },
  { format = "#{=1;m:a*,abc}|#{m;=1:a*,abc}|#{m/i;n:A*,abc}" },
]

[[cases]]
name = "format_loops_go_over_sessions_windows_and_panes"
steps = [
  { run = "new-session -d -s b" },
  { run = "new-session -d -s m" },
  { run = "rename-window -t o:0 mid" },
  { run = "new-window -d -t o:3 -n zed" },
  { run = "new-window -d -t o:1 -n alpha" },
  { run = "split-window -d -t o:0" },
  { run = "split-window -d -t o:0" },
  { run = "select-pane -t o:0.1" },
]
checks = [
  { command = "display -p -t o:0 '#{S:#{session_name}#{?loop_last_flag,,/}}|#{S/n:#{session_name} }|#{S/nr:#{session_name} }|#{S/r:#{session_name} }|#{S/t:#{session_name} }'" },
  { command = "display -p -t o:0 '#{W:#{window_index}:#{window_name} }|#{W:#{window_index} ,*#{window_index} }|#{W/n:#{window_name} }|#{W/r:#{window_index} }|#{W:a,b,c}'" },
  { command = "display -p -t o:0 '#{P:#{pane_index} }|#{P:#{pane_index} ,*#{pane_index} }|#{P/r:#{pane_index} }|#{loop_last_flag}'" },
  { command = "display -p -t o:0 '#{W:#{session_name}#{window_index}#{loop_last_flag} }|#{S:#{session_name}#{W:#{window_index}}|}|#{W/x:#{window_index}}'" },
]

[[cases]]
name = "run_shell_shows_error_output_only_with_e"
unix_only = true
checks = [
  { command = "run-shell 'echo out; echo err >&2'" },
  { command = "run-shell -E 'echo out; echo err >&2'" },
]

[[cases]]
name = "a_kept_pane_gets_its_remain_on_exit_line"
steps = [
  { run = "set -g remain-on-exit on" },
  { run = "set -g remain-on-exit-format 'gone #{pane_dead_status}/#{pane_dead_signal} #[bold]end'" },
  { run = "new-window -d -t o:1 'printf alpha; exit 3'" },
  { run = "new-window -d -t o:2 'printf beta; kill -TERM $$; sleep 5'" },
  { sleep = 1.0 },
]
checks = [
  { command = "display -p -t o:1 '[#{pane_dead_status}] [#{pane_dead_signal}]'" },
  { command = "display -p -t o:2 '[#{pane_dead_status}] [#{pane_dead_signal}]'" },
  { command = "capture-pane -p -t o:1" },
  { command = "capture-pane -p -t o:2" },
  { command = "show -gv remain-on-exit-format" },
]

[[cases]]
name = "an_empty_remain_on_exit_format_writes_nothing"
steps = [
  { run = "set -g remain-on-exit on" },
  { run = "set -g remain-on-exit-format ''" },
  { run = "new-window -d -t o:1 'printf alpha; exit 3'" },
  { sleep = 1.0 },
]
checks = [{ command = "capture-pane -p -t o:1" }, { format = "#{pane_dead}" }]

[[cases]]
name = "remain_on_exit_format_defaults_to_tmuxs"
checks = [{ command = "show -gv remain-on-exit-format" }]

[[cases]]
name = "alternate_screen_off_keeps_a_program_on_the_main_screen"
program = 'sleep 0.5; printf "main\n\033[?1049halt\n"; exec sleep 1000'
steps = [{ run = "set -g alternate-screen off" }, { sleep = 1.5 }]
checks = [
  { command = "capture-pane -p" },
  { format = "#{alternate_on}" },
