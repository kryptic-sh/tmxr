[[cases]]
name = "c_modifier_reads_colour_names_as_tmux"
checks = [{ format = "[#{c:red}] [#{c:BrightBlue}] [#{c:7}] [#{c:90}] [#{c:97}] [#{c:98}] [#{c:8}] [#{c:default}] [#{c:terminal}] [#{c:#ABCdef}] [#{c:#abcde}] [#{c:grey}] [#{c:gray50}] [#{c:grey33}] [#{c:GREY100}] [#{c:grey101}] [#{c:color12}] [#{c:colour256}] [#{c:nonsense}] [#{c:#{e|+|:90,1}}]" }]

[[cases]]
name = "a_format_syntax_error_ends_the_expansion_as_tmux"
checks = [
  { format = "A#{==:a}B" },
  { format = "A#{!=:a}B" },
  { format = "A#{<:a}B" },
  { format = "A#{>=:a}B" },
  { format = "A#{m:a}B" },
  { format = "A#{m/ri:a}B" },
  { format = "A#{R:x}B" },
  { format = "A#{==:a,a,a}B" },
  { format = "A#{==:a,a}B" },
  { format = "[#{R:ab,3}][#{m:*a*,bab}]" },
  { format = "A#{?#{==:a},x,y}B" },
  { format = "#{&&:1,1,0} #{&&:1,1,1} #{||:0,0,1} #{||:0,0} #{&&:1}" },
]

[[cases]]
name = "capture_pane_n_t_and_j_take_cells_as_tmux"
program = 'sleep 0.5; printf "ab  \n\033[5Cx\nfull-line-of-twenty!wrapped\n"; exec sleep 1000'
steps = [{ run = "resize-window -t o -x 20 -y 8" }, { sleep = 1.5 }]
checks = [
  { command = "capture-pane -p -E 3" },
  { command = "capture-pane -p -N -E 3" },
  { command = "capture-pane -p -T -E 3" },
  { command = "capture-pane -p -N -T -E 3" },
  { command = "capture-pane -p -J -E 3" },
  { command = "capture-pane -p -J -N -E 3" },
  { command = "capture-pane -p -N -e -E 3" },
]

[[cases]]
name = "x10_mouse_mode_9_is_ignored_as_tmux"
program = 'printf "\033[?9h"; exec sleep 1000'
steps = [{ sleep = 0.5 }]
checks = [{ format = "#{mouse_any_flag} #{mouse_standard_flag} #{mouse_button_flag} #{mouse_all_flag} #{mouse_sgr_flag} #{mouse_utf8_flag}" }]

[[cases]]
name = "resetting_any_mouse_mode_clears_the_one_set_as_tmux"
program = 'printf "\033[?1002h\033[?1000l"; exec sleep 1000'
steps = [{ sleep = 0.5 }]
checks = [{ format = "#{mouse_any_flag} #{mouse_standard_flag} #{mouse_button_flag} #{mouse_all_flag} #{mouse_sgr_flag} #{mouse_utf8_flag}" }]

[[cases]]
name = "utf8_and_sgr_mouse_encodings_are_kept_apart_as_tmux"
program = 'printf "\033[?1000;1006;1005h"; exec sleep 1000'
steps = [{ sleep = 0.5 }]
checks = [{ format = "#{mouse_any_flag} #{mouse_standard_flag} #{mouse_button_flag} #{mouse_all_flag} #{mouse_sgr_flag} #{mouse_utf8_flag}" }]

[[cases]]
name = "resetting_sgr_leaves_the_utf8_encoding_as_tmux"
program = 'printf "\033[?1000;1005;1006h\033[?1006l"; exec sleep 1000'
steps = [{ sleep = 0.5 }]
checks = [{ format = "#{mouse_any_flag} #{mouse_standard_flag} #{mouse_button_flag} #{mouse_all_flag} #{mouse_sgr_flag} #{mouse_utf8_flag}" }]

[[cases]]
name = "a_full_reset_clears_the_mouse_modes_as_tmux"
program = 'printf "\033[?1003;1005;1006h\033c"; exec sleep 1000'
steps = [{ sleep = 0.5 }]
checks = [{ format = "#{mouse_any_flag} #{mouse_standard_flag} #{mouse_button_flag} #{mouse_all_flag} #{mouse_sgr_flag} #{mouse_utf8_flag}" }]

[[cases]]
name = "formats_read_option_values_as_tmux"
steps = [
  { run = "set -g status-justify centre" },
  { run = "set -w -t o pane-status-style fg=red" },
  { run = "set -g escape-time 25" },
]
checks = [
  { format = "[#{status-justify}] [#{E:pane-status-style}] [#{escape-time}] [#{base-index}] [#{pane-status-current-style}] [#{session-status-style}] [#{nosuchoption}]" },
  { command = "show -gv session-status-current-style" },
]

[[cases]]
name = "a_job_in_the_status_line_shows_what_it_printed_as_tmux"
attach = true
unix_only = true
steps = [
  { run = "set -g status-right '<#(echo first; echo JOBOUT)>'" },
  { sleep = 1.5 },
]
checks = [
  { screen_contains = "<JOBOUT>", expect = true },
  { format = "[#(echo hi)]" },
]

[[cases]]
name = "loops_and_n_whose_lookups_fail_as_tmux"
steps = []
checks = [
  { command = "display -p 'a#{N:nosuch}b'" },
  { command = "display -p 'a#{N:0}b'" },
  { command = "display -p 'a#{N/w:nosuch}b'" },
  { command = "display -p 'a#{N/s:o}b#{N/s:zz}c'" },
  { command = "display -p 'a#{W:x#{window_index}}b'" },
  { command = "display -p 'a#{S:}b'" },
  { command = "display -p 'a#{P:#{pane_index},}b'" },
  { command = "display -p 'a#{L:x}b'" },
  { command = "display -p 'a#{W/zz:x}b'" },
]

[[cases]]
name = "window_flags_escape_the_activity_flag_as_tmux"
steps = [
  { run = "new-window -d -t o:1 'sleep 1; echo busy; exec sleep 1000'" },
  { run = "set -w -t o:1 monitor-activity on" },
  { sleep = 2.0 },
]
checks = [
  { command = "display -p -t o:1 '[#{window_flags}] [#{window_raw_flags}] [#F]'" },
  { command = "list-windows -t o -F '#{window_index}#{window_flags}'" },
]

[[cases]]
name = "a_status_line_draws_runs_of_hashes_as_tmux"
attach = true
unix_only = true
steps = [
  { run = "rename-window -t o aa##bb" },
  { run = "set -g @l 'x##[y'" },
  { run = "set -g status-left '#{@l} '" },
  { sleep = 0.5 },
]
checks = [
  { screen_contains = "aa#bb", expect = true },
  { screen_contains = "aa##bb", expect = false },
  { screen_contains = "x#[y", expect = true },
]

[[cases]]
name = "format_types_as_tmux"
steps = [{ run = "new-window -d -t o:1" }, { run = "split-window -d -t o:1" }]
checks = [
  { command = "display -p -t o:1 '#{session_format}#{window_format}#{pane_format}'" },
  { command = "display -p 'S[#{S:#{session_format}#{window_format}#{pane_format}}]'" },
  { command = "display -p -t o 'W[#{W:#{session_format}#{window_format}#{pane_format},}]'" },
  { command = "display -p -t o:1 'P[#{P:#{session_format}#{window_format}#{pane_format},}]'" },
  { command = "list-windows -t o -F '#{session_format}#{window_format}#{pane_format}'" },
  { command = "list-sessions -F '#{session_format}#{window_format}#{pane_format}'" },
  { command = "list-panes -t o:1 -F '#{session_format}#{window_format}#{pane_format}'" },
]

[[cases]]
name = "mode_formats_as_tmux"
steps = [{ run = "new-window -d -t o:1 -n second" }]
checks = [
  { command = "display -p '#{buffer_mode_format}'" },
  { command = "display -p '#{client_mode_format}'" },
  { command = "display -p '#{tree_mode_format}'" },
  { command = "display -p -t o '#{W:#{E:tree_mode_format}|}'" },
  { command = "display -p '#{S:#{E:tree_mode_format}|}'" },
]

[[cases]]
name = "strftime_week_numbers_as_tmux"
steps = []
checks = [{ command = "display -p '%U %W %V %G %g %x %z'" }]
