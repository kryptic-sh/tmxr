name: CI

# fmt, clippy, tests and a smoke run on Linux, macOS and Windows, plus
# dependency hygiene. Pushes to main also build the release binaries; a `v*`
# tag publishes them to a GitHub Release. The build and release jobs mirror
# hrdr's pipeline; its crates.io and package-channel jobs are not adopted yet
# — see docs/plan/14-ci-and-release.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy --workspace --all-targets --all-features --locked -- -D
          warnings

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Plain `cargo audit` fails only on real vulnerabilities; unmaintained /
      # yanked advisories are warnings, matching deny.toml's policy.
      - run: cargo audit

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run:
          cargo nextest run --workspace --all-features --locked --no-fail-fast
          --no-tests=warn
      - run: cargo test --workspace --doc --all-features --locked

  # The Windows suite again, with Microsoft's ConPTY beside tmxr.exe as the
  # release ships it (the job above covers Windows' built-in ConPTY).
  test-conpty:
    name: test windows-latest, bundled ConPTY
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: bash pkg/windows/fetch-conpty.sh target/debug
        shell: bash
      - run:
          cargo nextest run --workspace --all-features --locked --no-fail-fast
          --no-tests=warn

  smoke:
    name: build + smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p tmxr-cli
      - run: cargo run --locked -p tmxr-cli -- --version
      - run: cargo run --locked -p tmxr-cli -- --help

  # The server's named pipe admits its owner and refuses other users (its
  # DACL is owner + SYSTEM only). Needs a second account, which only CI has.
  pipe-acl:
    name: pipe admits only named users (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p tmxr-cli
      - name: Connect as the owner and as another user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A directory every user can read, so the other user can run tmxr.
          $dir = 'C:\Users\Public\tmxr-acl'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\debug\tmxr.exe "$dir\tmxr.exe"
          $pipe = '\\.\pipe\tmxr-acl-check'
          & "$dir\tmxr.exe" -S $pipe new-session -d -s owner
          if ($LASTEXITCODE -ne 0) { throw 'the server did not start' }
          & "$dir\tmxr.exe" -S $pipe ls
          if ($LASTEXITCODE -ne 0) { throw 'the owner was refused' }

          $name = 'tmxrother'
          # 14 characters: net user stops to ask about longer passwords.
          $password = 'Tm-' + [guid]::NewGuid().ToString('N').Substring(0, 8) + '!a1'
          net user $name $password /add
          if ($LASTEXITCODE -ne 0) { throw 'could not create the second user' }
          $cred = [pscredential]::new($name, (ConvertTo-SecureString $password -AsPlainText -Force))
          $p = Start-Process -FilePath "$dir\tmxr.exe" -ArgumentList '-S', $pipe, 'ls' `
            -Credential $cred -WorkingDirectory $dir -Wait -PassThru `
            -RedirectStandardOutput "$dir\out.txt" -RedirectStandardError "$dir\err.txt"
          $err = Get-Content -Raw "$dir\err.txt"
          Write-Output "other user: exit $($p.ExitCode), stderr: $err"
          # tmxr itself must have run and been refused (os error 5 is
          # ERROR_ACCESS_DENIED), not merely failed to start.
          if ($p.ExitCode -eq 0) { throw 'another user listed the sessions' }
          if ($err -notmatch 'os error 5') { throw "not an access-denied refusal: $err" }

          & "$dir\tmxr.exe" -S $pipe kill-server

          # socket-access users: the pipe opens to everyone, and the server
          # admits the other user only once server-access names them.
          Set-Content -Path "$dir\users.toml" -Value 'socket-access = "users"'
          $open = '\\.\pipe\tmxr-acl-users'
          & "$dir\tmxr.exe" -S $open -f "$dir\users.toml" new-session -d -s owner
          if ($LASTEXITCODE -ne 0) { throw 'the users server did not start' }
          function Invoke-Other([string[]] $cmd) {
            $p = Start-Process -FilePath "$dir\tmxr.exe" -ArgumentList (@('-S', $open) + $cmd) `
              -Credential $cred -WorkingDirectory $dir -Wait -PassThru `
              -RedirectStandardOutput "$dir\out.txt" -RedirectStandardError "$dir\err.txt"
            $out = Get-Content -Raw "$dir\out.txt"
            $err = Get-Content -Raw "$dir\err.txt"
            # Write-Host: anything written to output would join the return value.
            Write-Host "other user, $($cmd -join ' '): exit $($p.ExitCode), stdout: $out, stderr: $err"
            return @{ Code = $p.ExitCode; Out = "$out"; Err = "$err" }
          }
          $r = Invoke-Other @('ls')
          if ($r.Code -eq 0) { throw 'admitted before server-access named the user' }
          & "$dir\tmxr.exe" -S $open server-access -r -a $name
          if ($LASTEXITCODE -ne 0) { throw 'server-access -a failed' }
          $r = Invoke-Other @('ls')
          if ($r.Code -ne 0 -or $r.Out -notmatch 'owner:') { throw 'the named user could not list' }
          $r = Invoke-Other @('kill-server')
          if ($r.Code -eq 0 -or $r.Err -notmatch 'read-only') { throw 'a read-only user ran kill-server' }
          & "$dir\tmxr.exe" -S $open server-access -w $name
          $r = Invoke-Other @('rename-session', '-t', 'owner', 'renamed')
          if ($r.Code -ne 0) { throw 'a writable user was refused' }
          & "$dir\tmxr.exe" -S $open server-access -d $name
          $r = Invoke-Other @('ls')
          if ($r.Code -eq 0) { throw 'admitted after server-access -d' }
          & "$dir\tmxr.exe" -S $open kill-server
          net user $name /delete | Out-Null

  socket-acl:
    name: socket admits only named users (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p tmxr-cli
      - name: Connect as the owner and as another user
        run: |
          set -eu
          sudo useradd --create-home tmxrother
          # A directory the other user can reach, as tmux asks for -S.
          dir=$(mktemp -d /tmp/tmxr-acl.XXXXXX)
          chmod 0755 "$dir"
          cp target/debug/tmxr "$dir/tmxr"
          chmod 0755 "$dir/tmxr"
          other() {
            sudo -u tmxrother env HOME=/home/tmxrother "$dir/tmxr" "$@"
          }

          # The default socket-access: the socket file itself refuses them.
          "$dir/tmxr" -S "$dir/private" new-session -d -s owner
          if other -S "$dir/private" ls 2>"$dir/err"; then
            echo 'another user listed the sessions'; exit 1
          fi
          cat "$dir/err"
          grep -qi 'permission denied' "$dir/err"
          "$dir/tmxr" -S "$dir/private" kill-server

          printf 'socket-access = "users"\n' > "$dir/users.toml"
          sock="$dir/open"
          "$dir/tmxr" -S "$sock" -f "$dir/users.toml" new-session -d -s owner
          if other -S "$sock" ls; then
            echo 'admitted before server-access named the user'; exit 1
          fi
          "$dir/tmxr" -S "$sock" server-access -r -a tmxrother
          other -S "$sock" ls | grep -q '^owner:'
          if other -S "$sock" kill-server 2>"$dir/err"; then
            echo 'a read-only user ran kill-server'; exit 1
          fi
          grep -q 'read-only' "$dir/err"
          "$dir/tmxr" -S "$sock" server-access -w tmxrother
          other -S "$sock" rename-session -t owner renamed
          "$dir/tmxr" -S "$sock" server-access -d tmxrother
          if other -S "$sock" ls; then
            echo 'admitted after server-access -d'; exit 1
          fi
          "$dir/tmxr" -S "$sock" kill-server

  build:
    name: Build ${{ matrix.target }}
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.28
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'true'
            rpm: 'true'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.28
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'true'
            rpm: 'true'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zigbuild_target: x86_64-unknown-linux-musl
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zigbuild_target: aarch64-unknown-linux-musl
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zigbuild_target: ''
            zig: 'false'
            macos_min: ''
            suffix: '.exe'
            archive: zip
            deb: 'false'
            rpm: 'false'
          - os: macos-latest
            target: aarch64-apple-darwin
            zigbuild_target: ''
            zig: 'false'
            macos_min: '11.0'
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
          - os: macos-latest
            target: x86_64-apple-darwin
            zigbuild_target: ''
            zig: 'false'
            macos_min: '10.15'
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false
      - run: rustup update --no-self-update stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Setup zig
        if: matrix.zig == 'true'
        uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
        with:
          version: '0.15.1'
      - name: Install cargo-zigbuild
        if: matrix.zig == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build binary (zigbuild)
        if: matrix.zig == 'true'
        env:
          # zig's linker reports that it ignores rustc's `-O1` linker flag,
          # and setup-rust-toolchain@v2's CARGO_BUILD_WARNINGS=deny turns
          # that linker message into an error. Code warnings still fail the
          # build through RUSTFLAGS=-D warnings.
          CARGO_BUILD_WARNINGS: warn
        run:
          cargo zigbuild --release --locked --target ${{ matrix.zigbuild_target
          }} -p tmxr-cli --bin tmxr
      - name: Build binary (native)
        if: matrix.zig == 'false'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run:
          cargo build --release --locked --target ${{ matrix.target }} -p
          tmxr-cli --bin tmxr
      - name: Smoke artifact
        if:
          matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target ==
          'aarch64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/tmxr --version
      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="tmxr-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tmxr dist/
          cp README.md LICENSE dist/
          tar -czf "$ARCHIVE" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - name: Bundle Microsoft's ConPTY (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: bash pkg/windows/fetch-conpty.sh dist
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "tmxr-$tag-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tmxr.exe dist/
          Copy-Item README.md, LICENSE, pkg/windows/ConPTY-LICENSE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          # An LF line, as sha256sum writes: Out-File's CRLF breaks
          # `sha256sum -c` on the file name.
          [IO.File]::WriteAllText("$PWD/$archive.sha256", "$hash  $archive`n")
      - name: Generate completions + man page for packaging
        if: matrix.deb == 'true' || matrix.rpm == 'true'
        run: |
          # Host debug build: completions/man are target-independent text,
          # and the cross-built (aarch64) target binary can't run here.
          mkdir -p pkgext/completions
          for shell in bash zsh fish; do
            cargo run --locked -q -p tmxr-cli -- --completions "$shell" > "pkgext/completions/tmxr.$shell"
          done
          cargo run --locked -q -p tmxr-cli -- --man > pkgext/tmxr.1
      - name: Install cargo-deb
        if: matrix.deb == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build .deb
        if: matrix.deb == 'true'
        run: |
          cargo deb -p tmxr-cli --target ${{ matrix.target }} --no-build --no-strip
          DEB_FILE=$(ls target/${{ matrix.target }}/debian/tmxr_*.deb | head -1)
          cp "$DEB_FILE" .
          sha256sum "$(basename "$DEB_FILE")" > "$(basename "$DEB_FILE").sha256"
      - name: Install cargo-generate-rpm
        if: matrix.rpm == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm
      - name: Build .rpm
        if: matrix.rpm == 'true'
        run: |
          cargo generate-rpm -p apps/tmxr --target ${{ matrix.target }} --payload-compress none
          RPM_FILE=$(ls target/${{ matrix.target }}/generate-rpm/tmxr-*.rpm | head -1)
          cp "$RPM_FILE" .
          sha256sum "$(basename "$RPM_FILE")" > "$(basename "$RPM_FILE").sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmxr-${{ matrix.target }}
          path: |
            tmxr-*.tar.gz
            tmxr-*.tar.gz.sha256
            tmxr-*.zip
            tmxr-*.zip.sha256
            tmxr_*.deb
            tmxr_*.deb.sha256
            tmxr-*.rpm
            tmxr-*.rpm.sha256

  publish-github-release:
    name: Publish GitHub Release
    needs:
      [
        build,
        fmt,
        clippy,
        deny,
        audit,
        machete,
        smoke,
        test,
        test-conpty,
        pipe-acl,
        socket-acl,
      ]
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tmxr-*
          merge-multiple: true
          path: dist
      - name: Generate completions + man page
        run: |
          # Archive entries are prefixed ./ (tar -C dist .)
          tar -xzf dist/tmxr-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz ./tmxr
          mkdir -p pkgext/completions
          for shell in bash zsh fish powershell elvish nushell; do
            ./tmxr --completions "$shell" > "pkgext/completions/tmxr.$shell"
          done
          ./tmxr --man > pkgext/tmxr.1
          tar -C pkgext -czf dist/tmxr-${GITHUB_REF_NAME}-completions-man.tar.gz .
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - name: Publish workspace crates (topo order, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # hjkl-style publish helper: idempotency probe (crates.io 403s
          # UA-less requests, so it must send a User-Agent), 429 retries
          # parsing the "try again after" timestamp (11-min fallback), and
          # pacing between crates to stay under the publish rate limits.
          publish_if_missing() {
            local crate="$1"
            local url="https://crates.io/api/v1/crates/${crate}/${VERSION}"
            if curl -fsS -A "${crate}-release-ci" -o /dev/null "$url"; then
              echo "::notice::${crate}@${VERSION} already on crates.io, skipping"
              return 0
            fi
            local attempt=0
            while [ $attempt -lt 6 ]; do
              if cargo publish -p "${crate}" --locked 2>&1 | tee /tmp/publish_"${crate}".log; then
                # Pacing across the workspace (cargo itself waits for index
                # propagation before returning).
                sleep 25
                return 0
              fi
              if grep -qiE "429|Too Many Requests" /tmp/publish_"${crate}".log; then
                local wait_until wait_secs target
                # Match the RFC 1123 stamp exactly. The old pattern was
                # `try again after [^.]+`, which runs past the timestamp and
                # stops at the first period — inside `crates.io` — yielding
                # "… 10:18:27 GMT and see https://crates". `date -d` then fails,
                # the substitution is empty, the arithmetic goes hugely negative
                # and the floor below turns every wait into a flat 30s. v0.8.1
                # retried 11s BEFORE the limit lifted, three times, and gave up
                # with eight of nine crates published.
                wait_until=$(grep -oE 'try again after [A-Za-z]{3}, [0-9]{1,2} [A-Za-z]{3} [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT' \
                  /tmp/publish_"${crate}".log | head -1 | sed 's/try again after //' || true)
                if [ -n "$wait_until" ] && target=$(date -d "$wait_until" +%s 2>/dev/null); then
                  wait_secs=$(( target - $(date +%s) + 15 ))
                  # Only a floor for a stamp already in the past, never a cap:
                  # sleeping less than the server asked for burns an attempt and
                  # pushes the next slot further out.
                  [ "$wait_secs" -lt 15 ] && wait_secs=15
                  echo "::warning::rate limited publishing ${crate}, sleeping ${wait_secs}s until $wait_until"
                else
                  wait_secs=660
                  echo "::warning::rate limited publishing ${crate}, sleeping ${wait_secs}s (11 min fallback; no parsable stamp)"
                fi
                sleep "$wait_secs"
                attempt=$(( attempt + 1 ))
              else
                echo "::error::publish failed for ${crate} (non-rate-limit error)"
                return 1
              fi
            done
            # Every attempt honours the server's own timestamp: a whole release
            # publishes every crate in `ORDER`, and crates.io refills the "updates to existing
            # crates" bucket about once a minute, so a release cut minutes after
            # another one needs real patience here.
            echo "::error::publish failed for ${crate} after 6 rate-limit retries"
            return 1
          }
          # Dependency order: the crates with no internal deps first, each
          # crate after the ones it needs, and `tmxr-cli` (the `tmxr` binary)
          # last because it depends on the rest.
          ORDER="tmxr-proto tmxr-command tmxr-config tmxr-term tmxr-server tmxr-client tmxr-cli"
          # A crate missing from ORDER fails the release *before* anything is
          # uploaded, rather than half-publishing and stranding the binary: a new
          # library that ships without being added here cannot be published, and
          # neither can `tmxr-cli` once the libs ahead of it are already up — leaving
          # a tagged release with no binary. `publish = false` members are not
          # publishable and are not listed.
          MEMBERS=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          LISTED=$(printf '%s\n' $ORDER | sort)
          if [ "$MEMBERS" != "$LISTED" ]; then
            echo "::error::publish list drift — every publishable workspace member must be in ORDER, in dependency order"
            diff <(echo "$LISTED") <(echo "$MEMBERS") | sed 's/^/  /' || true
            exit 1
          fi
          for CRATE in $ORDER; do
            publish_if_missing "$CRATE"
          done

  aur-bin:
    name: Publish AUR (tmxr-bin)
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install deps
        run: pacman -Sy --noconfirm --needed base-devel git openssh curl
      - uses: actions/checkout@v7
      - name: Resolve version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Render PKGBUILD
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          BASE="https://github.com/kryptic-sh/tmxr/releases/download/v${VERSION}"
          SHA_X86=$(curl -sL "$BASE/tmxr-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          SHA_A64=$(curl -sL "$BASE/tmxr-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1}')
          test -n "$SHA_X86" && test -n "$SHA_A64"
          mkdir -p out
          sed -e "s/{VERSION}/${VERSION}/g" \
              -e "s/{SHA256_X86_64}/${SHA_X86}/g" \
              -e "s/{SHA256_AARCH64}/${SHA_A64}/g" \
              pkg/aur/PKGBUILD-bin.in > out/PKGBUILD
      - name: Generate .SRCINFO
        run: |
          useradd -m builder
          chown -R builder out
          su -s /bin/bash builder -c 'cd out && makepkg --printsrcinfo > .SRCINFO'
      - name: Push to AUR
        run: |
          # Assigned HERE, not in an `env:` block: a `~` inside an env value is
          # never expanded. git runs this via `sh -c`, tilde expansion does not
          # apply to the result of a parameter expansion, and ssh does not expand
          # `~` in a `-o` value either -- so the pin below would go unread and
          # StrictHostKeyChecking=yes would fail with "No ED25519 host key is
          # known". That is exactly how buffr's v0.14.7 AUR publish broke.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          install -dm700 ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned host keys. Source: ssh-keyscan aur.archlinux.org.
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS_EOF'
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          KNOWN_HOSTS_EOF
          chmod 600 ~/.ssh/known_hosts
          git config --global user.name  "tmxr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone ssh://aur@aur.archlinux.org/tmxr-bin.git aur-repo
          cp out/PKGBUILD out/.SRCINFO aur-repo/
          cp pkg/aur/LICENSE pkg/aur/.gitignore aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO LICENSE .gitignore
          if git diff --cached --quiet; then echo "nothing to push"; exit 0; fi
          git commit -m "tmxr-bin ${{ steps.tag.outputs.version }}-1"
          git push origin master

