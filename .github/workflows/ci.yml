  alpine:
    name: Publish Alpine .apk
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    container: alpine:latest
    permissions:
      contents: write
    steps:
      - name: Install deps
        run: apk add --no-cache alpine-sdk bash curl coreutils
      - uses: actions/checkout@v7
      - name: Resolve version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Render APKBUILD
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          BASE="https://github.com/kryptic-sh/tmxr/releases/download/v${VERSION}"
          curl -sLO "$BASE/tmxr-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          SHA512=$(sha512sum "tmxr-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" | awk '{print $1}')
          mkdir -p out
          sed -e "s/{VERSION}/${VERSION}/g" \
              -e "s/{SHA512_X86_64}/${SHA512}/g" \
              pkg/alpine/APKBUILD.in > out/APKBUILD
      - name: Build .apk
        run: |
          adduser -D builder
          addgroup builder abuild
          mkdir -p /var/cache/distfiles
          chmod a+w /var/cache/distfiles
          cp "tmxr-v${{ steps.tag.outputs.version }}-x86_64-unknown-linux-musl.tar.gz" /var/cache/distfiles/
          chown -R builder out
          su builder -c 'abuild-keygen -a -n'
          # Install the pubkey BEFORE building or index signing fails.
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
          su builder -c "cd $PWD/out && abuild -F -r"
          APK=$(find /home/builder/packages -name 'tmxr-*.apk' | head -1)
          cp "$APK" .
          sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256"
      - name: Upload .apk to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tmxr-*.apk
            tmxr-*.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-release-status:
    name: tag-release status
    needs:
      [
        fmt,
        clippy,
        machete,
        deny,
        test,
        test-conpty,
        pipe-acl,
        socket-acl,
        smoke,
        build,
        publish-github-release,
        publish-crates,
        aur-bin,
        brew-tap,
        scoop-bucket,
        alpine,
      ]
    if:
      always() && github.event_name == 'push' && startsWith(github.ref,
      'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          RESULT='${{ toJSON(needs.*.result) }}'
          echo "Release job results: $RESULT"
          if ! echo "$RESULT" | jq -e 'all(. == "success")' >/dev/null; then
            echo "❌ Every required check and publish job must succeed on a release tag"
            exit 1
          fi
          echo "✅ All release checks and publish jobs completed successfully"
