name: CI

# fmt, clippy, tests and a smoke run on Linux, macOS and Windows, plus
# dependency hygiene. Pushes to main also build the release binaries; a `v*`
# tag publishes them to a GitHub Release. The build and release jobs mirror
# hrdr's pipeline; its crates.io and package-channel jobs are not adopted yet
# — see docs/plan/14-ci-and-release.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy --workspace --all-targets --all-features --locked -- -D
          warnings

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Plain `cargo audit` fails only on real vulnerabilities; unmaintained /
      # yanked advisories are warnings, matching deny.toml's policy.
      - run: cargo audit

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run:
          cargo nextest run --workspace --all-features --locked --no-fail-fast
          --no-tests=warn
      - run: cargo test --workspace --doc --all-features --locked

  # The Windows suite again, with Microsoft's ConPTY beside tmxr.exe as the
  # release ships it (the job above covers Windows' built-in ConPTY).
  test-conpty:
    name: test windows-latest, bundled ConPTY
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: bash pkg/windows/fetch-conpty.sh target/debug
        shell: bash
      - run:
          cargo nextest run --workspace --all-features --locked --no-fail-fast
          --no-tests=warn

  smoke:
    name: build + smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p tmxr
      - run: cargo run --locked -p tmxr -- --version
      - run: cargo run --locked -p tmxr -- --help

  # The server's named pipe admits its owner and refuses other users (its
  # DACL is owner + SYSTEM only). Needs a second account, which only CI has.
  pipe-acl:
    name: pipe refuses other users (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p tmxr
      - name: Connect as the owner and as another user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A directory every user can read, so the other user can run tmxr.
          $dir = 'C:\Users\Public\tmxr-acl'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\debug\tmxr.exe "$dir\tmxr.exe"
          $pipe = '\\.\pipe\tmxr-acl-check'
          & "$dir\tmxr.exe" -S $pipe new-session -d -s owner
          if ($LASTEXITCODE -ne 0) { throw 'the server did not start' }
          & "$dir\tmxr.exe" -S $pipe ls
          if ($LASTEXITCODE -ne 0) { throw 'the owner was refused' }

          $name = 'tmxrother'
          # 14 characters: net user stops to ask about longer passwords.
          $password = 'Tm-' + [guid]::NewGuid().ToString('N').Substring(0, 8) + '!a1'
          net user $name $password /add
          if ($LASTEXITCODE -ne 0) { throw 'could not create the second user' }
          $cred = [pscredential]::new($name, (ConvertTo-SecureString $password -AsPlainText -Force))
          $p = Start-Process -FilePath "$dir\tmxr.exe" -ArgumentList '-S', $pipe, 'ls' `
            -Credential $cred -WorkingDirectory $dir -Wait -PassThru `
            -RedirectStandardOutput "$dir\out.txt" -RedirectStandardError "$dir\err.txt"
          $err = Get-Content -Raw "$dir\err.txt"
          Write-Output "other user: exit $($p.ExitCode), stderr: $err"
          # tmxr itself must have run and been refused (os error 5 is
          # ERROR_ACCESS_DENIED), not merely failed to start.
          if ($p.ExitCode -eq 0) { throw 'another user listed the sessions' }
          if ($err -notmatch 'os error 5') { throw "not an access-denied refusal: $err" }

          & "$dir\tmxr.exe" -S $pipe kill-server
          net user $name /delete | Out-Null

  build:
    name: Build ${{ matrix.target }}
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.28
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'true'
            rpm: 'true'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.28
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'true'
            rpm: 'true'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zigbuild_target: x86_64-unknown-linux-musl
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zigbuild_target: aarch64-unknown-linux-musl
            zig: 'true'
            macos_min: ''
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zigbuild_target: ''
            zig: 'false'
            macos_min: ''
            suffix: '.exe'
            archive: zip
            deb: 'false'
            rpm: 'false'
          - os: macos-latest
            target: aarch64-apple-darwin
            zigbuild_target: ''
            zig: 'false'
            macos_min: '11.0'
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
          - os: macos-latest
            target: x86_64-apple-darwin
            zigbuild_target: ''
            zig: 'false'
            macos_min: '10.15'
            suffix: ''
            archive: tar.gz
            deb: 'false'
            rpm: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false
      - run: rustup update --no-self-update stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Setup zig
        if: matrix.zig == 'true'
        uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
        with:
          version: '0.15.1'
      - name: Install cargo-zigbuild
        if: matrix.zig == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build binary (zigbuild)
        if: matrix.zig == 'true'
        env:
          # zig's linker reports that it ignores rustc's `-O1` linker flag,
          # and setup-rust-toolchain@v2's CARGO_BUILD_WARNINGS=deny turns
          # that linker message into an error. Code warnings still fail the
          # build through RUSTFLAGS=-D warnings.
          CARGO_BUILD_WARNINGS: warn
        run:
          cargo zigbuild --release --locked --target ${{ matrix.zigbuild_target
          }} -p tmxr --bin tmxr
      - name: Build binary (native)
        if: matrix.zig == 'false'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run:
          cargo build --release --locked --target ${{ matrix.target }} -p tmxr
          --bin tmxr
      - name: Smoke artifact
        if:
          matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target ==
          'aarch64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/tmxr --version
      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="tmxr-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tmxr dist/
          cp README.md LICENSE dist/
          tar -czf "$ARCHIVE" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - name: Bundle Microsoft's ConPTY (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: bash pkg/windows/fetch-conpty.sh dist
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "tmxr-$tag-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tmxr.exe dist/
          Copy-Item README.md, LICENSE, pkg/windows/ConPTY-LICENSE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          # An LF line, as sha256sum writes: Out-File's CRLF breaks
          # `sha256sum -c` on the file name.
          [IO.File]::WriteAllText("$PWD/$archive.sha256", "$hash  $archive`n")
      - name: Generate completions + man page for packaging
        if: matrix.deb == 'true' || matrix.rpm == 'true'
        run: |
          # Host debug build: completions/man are target-independent text,
          # and the cross-built (aarch64) target binary can't run here.
          mkdir -p pkgext/completions
          for shell in bash zsh fish; do
            cargo run --locked -q -p tmxr -- --completions "$shell" > "pkgext/completions/tmxr.$shell"
          done
          cargo run --locked -q -p tmxr -- --man > pkgext/tmxr.1
      - name: Install cargo-deb
        if: matrix.deb == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build .deb
        if: matrix.deb == 'true'
        run: |
          cargo deb -p tmxr --target ${{ matrix.target }} --no-build --no-strip
          DEB_FILE=$(ls target/${{ matrix.target }}/debian/tmxr_*.deb | head -1)
          cp "$DEB_FILE" .
          sha256sum "$(basename "$DEB_FILE")" > "$(basename "$DEB_FILE").sha256"
      - name: Install cargo-generate-rpm
        if: matrix.rpm == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm
      - name: Build .rpm
        if: matrix.rpm == 'true'
        run: |
          cargo generate-rpm -p apps/tmxr --target ${{ matrix.target }} --payload-compress none
          RPM_FILE=$(ls target/${{ matrix.target }}/generate-rpm/tmxr-*.rpm | head -1)
          cp "$RPM_FILE" .
          sha256sum "$(basename "$RPM_FILE")" > "$(basename "$RPM_FILE").sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmxr-${{ matrix.target }}
          path: |
            tmxr-*.tar.gz
            tmxr-*.tar.gz.sha256
            tmxr-*.zip
            tmxr-*.zip.sha256
            tmxr_*.deb
            tmxr_*.deb.sha256
            tmxr-*.rpm
            tmxr-*.rpm.sha256

  publish-github-release:
    name: Publish GitHub Release
    needs:
      [
        build,
        fmt,
        clippy,
        deny,
        audit,
        machete,
        smoke,
        test,
        test-conpty,
        pipe-acl,
      ]
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tmxr-*
          merge-multiple: true
          path: dist
      - name: Generate completions + man page
        run: |
          # Archive entries are prefixed ./ (tar -C dist .)
          tar -xzf dist/tmxr-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz ./tmxr
          mkdir -p pkgext/completions
          for shell in bash zsh fish powershell elvish nushell; do
            ./tmxr --completions "$shell" > "pkgext/completions/tmxr.$shell"
          done
          ./tmxr --man > pkgext/tmxr.1
          tar -C pkgext -czf dist/tmxr-${GITHUB_REF_NAME}-completions-man.tar.gz .
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-release-status:
    name: tag-release status
    needs:
      [
        fmt,
        clippy,
        machete,
        deny,
        test,
        test-conpty,
        pipe-acl,
        smoke,
        build,
        publish-github-release,
      ]
    if:
      always() && github.event_name == 'push' && startsWith(github.ref,
      'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          RESULT='${{ toJSON(needs.*.result) }}'
          echo "Release job results: $RESULT"
          if ! echo "$RESULT" | jq -e 'all(. == "success")' >/dev/null; then
            echo "❌ Every required check and publish job must succeed on a release tag"
            exit 1
          fi
          echo "✅ All release checks and publish jobs completed successfully"
