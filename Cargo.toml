[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/tmxr"
homepage = "https://github.com/kryptic-sh/tmxr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
readme = "README.md"

[workspace.lints.clippy]
or_fun_call = "deny"
unused_peekable = "deny"
assigning_clones = "warn"
format_push_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
use_self = "warn"
redundant_pub_crate = "warn"

[workspace.dependencies]
# The panes' terminal emulator, kryptic-sh's own (it replaced vt100).
vt1k = { git = "https://github.com/kryptic-sh/vt1k", rev = "5d247c9656c2c59ad48887180365d2c73903a737", version = "0.1.0" }
# internal
tmxr-proto = { path = "crates/tmxr-proto", version = "0.10.0" }
tmxr-command = { path = "crates/tmxr-command", version = "0.10.0" }
tmxr-config = { path = "crates/tmxr-config", version = "0.10.0" }
tmxr-term = { path = "crates/tmxr-term", version = "0.10.0" }
tmxr-server = { path = "crates/tmxr-server", version = "0.10.0" }
tmxr-client = { path = "crates/tmxr-client", version = "0.10.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# crossterm 0.29.0 with Alt+Esc parsed on Unix (crossterm-rs/crossterm#1143),
# a SIGWINCH that comes with input kept, an unknown CSI ? report no longer
# swallowing later input (crossterm-rs/crossterm#1106) and the terminal's
# color-scheme reports read; drop once a crossterm release carries them all.
[patch.crates-io]
crossterm = { git = "https://github.com/kryptic-sh/crossterm", rev = "ef87b584d18ea0190ee2fc2f821c71c0324f4947" }
