[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/tmxr"
homepage = "https://github.com/kryptic-sh/tmxr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]
readme = "README.md"

[workspace.lints.clippy]
or_fun_call = "deny"
unused_peekable = "deny"
assigning_clones = "warn"
format_push_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
use_self = "warn"
redundant_pub_crate = "warn"

[workspace.dependencies]
# internal
tmxr-proto = { path = "crates/tmxr-proto", version = "0.9.0" }
tmxr-command = { path = "crates/tmxr-command", version = "0.9.0" }
tmxr-config = { path = "crates/tmxr-config", version = "0.9.0" }
tmxr-term = { path = "crates/tmxr-term", version = "0.9.0" }
tmxr-server = { path = "crates/tmxr-server", version = "0.9.0" }
tmxr-client = { path = "crates/tmxr-client", version = "0.9.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# crossterm 0.29.0 with Alt+Esc parsed on Unix (crossterm-rs/crossterm#1143)
# and a SIGWINCH that comes with input kept; drop once a crossterm release
# carries both.
# vt100 0.18.1 without the allocations per line scrolled into history
# (doy/vt100-rust#47), with a cell read in constant time (#48) and history
# rows narrowed again once scrolled past (#49); drop once a vt100 release
# carries all three.
[patch.crates-io]
crossterm = { git = "https://github.com/kryptic-sh/crossterm", rev = "08697c050383371f02bf957109a3583e48930c0f" }
vt100 = { git = "https://github.com/kryptic-sh/vt100-rust", rev = "850b837c7741b6431b6989d7b04abb9d96480ca3" }
