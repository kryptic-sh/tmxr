[package]
name = "tmxr"
description = "A tmux-style terminal multiplexer for Linux, macOS and Windows."
keywords = ["tmux", "terminal", "multiplexer", "tui", "pty"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.deb]
maintainer = "mxaddict <mxaddict@kryptic.sh>"
copyright = "2026, mxaddict <mxaddict@kryptic.sh>"
extended-description = "tmxr: a tmux-style terminal multiplexer with tmux's commands and key bindings, a client/server design, session save and restore, and a vi copy mode."
section = "utils"
priority = "optional"
assets = [
  ["target/release/tmxr", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/tmxr/README.md", "644"],
  ["../../LICENSE", "usr/share/doc/tmxr/LICENSE", "644"],
  # Generated by CI (host `tmxr --completions/--man`) before cargo-deb runs.
  ["../../pkgext/completions/tmxr.bash", "usr/share/bash-completion/completions/tmxr", "644"],
  ["../../pkgext/completions/tmxr.zsh", "usr/share/zsh/vendor-completions/_tmxr", "644"],
  ["../../pkgext/completions/tmxr.fish", "usr/share/fish/vendor_completions.d/tmxr.fish", "644"],
  ["../../pkgext/tmxr.1", "usr/share/man/man1/tmxr.1", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/tmxr", dest = "/usr/bin/tmxr", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/tmxr/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/tmxr/LICENSE", mode = "644", doc = true },
  # Generated by CI (host `tmxr --completions/--man`) before generate-rpm runs.
  { source = "pkgext/completions/tmxr.bash", dest = "/usr/share/bash-completion/completions/tmxr", mode = "644" },
  { source = "pkgext/completions/tmxr.zsh", dest = "/usr/share/zsh/site-functions/_tmxr", mode = "644" },
  { source = "pkgext/completions/tmxr.fish", dest = "/usr/share/fish/vendor_completions.d/tmxr.fish", mode = "644" },
  { source = "pkgext/tmxr.1", dest = "/usr/share/man/man1/tmxr.1", mode = "644", doc = true },
]

[[bin]]
name = "tmxr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
hjkl-xdg = "0.42.1"
tmxr-client.workspace = true
tmxr-proto.workspace = true
tmxr-server.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
tmxr-term.workspace = true
