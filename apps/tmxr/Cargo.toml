[package]
name = "tmxr"
description = "A tmux-style terminal multiplexer for Linux, macOS and Windows."
keywords = ["tmux", "terminal", "multiplexer", "tui", "pty"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "tmxr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hjkl-xdg = "0.42.1"
tmxr-client.workspace = true
tmxr-proto.workspace = true
tmxr-server.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
tmxr-term.workspace = true
