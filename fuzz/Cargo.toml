[package]
name = "tmxr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "Fuzz targets for tmxr (plan 20): cargo fuzz run <target>."

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the main build and the stable toolchain never see
# libfuzzer-sys.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"
tmxr-command = { path = "../crates/tmxr-command" }
tmxr-config = { path = "../crates/tmxr-config" }
tmxr-proto = { path = "../crates/tmxr-proto" }
tmxr-server = { path = "../crates/tmxr-server" }
tmxr-term = { path = "../crates/tmxr-term" }
ttyr = "0.3.0"
vt1k = "0.1.1"

[[bin]]
name = "proto_frame"
path = "fuzz_targets/proto_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tmxr_env"
path = "fuzz_targets/tmxr_env.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_line"
path = "fuzz_targets/command_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_expand"
path = "fuzz_targets/format_expand.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_names"
path = "fuzz_targets/key_names.rs"
test = false
doc = false
bench = false

[[bin]]
